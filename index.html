<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Il Mio Camper</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e8834a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#eef1f4; --card:#ffffff; --text:#1c1c1e; --muted:#8a8f98;
    --border:#e6e8eb; --accent:#e8834a; --ok:#34a366; --danger:#e5484d;
    --shadow: 0 1px 2px rgba(20,20,30,0.06), 0 1px 1px rgba(20,20,30,0.04);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
  }
  header{
    padding:16px; background:var(--bg);
    position:sticky; top:0; z-index:10;
    display:flex; align-items:center; gap:8px;
  }
  header h1{font-size:19px; margin:0; font-weight:700; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .offline-banner{
    background:#fde3cf; color:#7a4a1a; font-size:12.5px; font-weight:600;
    padding:9px 16px; text-align:center; line-height:1.4;
  }
  main{padding:0 16px 110px; max-width:640px; margin:0 auto;}

  .bottom-bar{
    display:none; position:fixed; left:0; right:0; bottom:0; z-index:100;
    align-items:center; gap:8px;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--bg) 75%, transparent);
  }
  .bottom-bar.show{display:flex;}
  .bb-nav-btn{
    flex-shrink:0;
    background:#1a1a18; color:#f5f4f0; border:none; border-radius:50px;
    padding:11px 16px; font-size:13px; font-weight:600; font-family:inherit; cursor:pointer;
    display:flex; align-items:center; gap:5px; box-shadow:0 4px 14px rgba(0,0,0,0.3);
    white-space:nowrap; transition:background .15s;
  }
  .bb-nav-btn:active{background:#333;}
  #bottomBarAction{flex:1; min-width:0;}
  #bottomBarAction .btn{margin:0; width:100%;}

  .list{display:flex; flex-direction:column; gap:12px;}
  .item{
    background:var(--card); border-radius:18px; box-shadow:var(--shadow);
    padding:16px; display:flex; align-items:center; gap:14px; cursor:pointer;
    border:1px solid transparent;
  }
  .item:active{transform:scale(.98);}
  .sortable-chosen{box-shadow:0 10px 24px rgba(0,0,0,0.18); transform:scale(1.02);}
  .sortable-ghost{opacity:0.35;}
  .item .badge{
    width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center;
    font-size:24px; flex-shrink:0;
  }
  .item .txt{flex:1; min-width:0;}
  .item .txt .t{font-size:16.5px; font-weight:700; margin-bottom:2px;}
  .item .txt .s{font-size:13.5px; color:var(--muted);}
  .item .chev{color:#c4c8cd; font-size:20px; flex-shrink:0;}
  .item.add{border:1.5px dashed #c9ccd1; box-shadow:none;}
  .item.add .badge{background:#eceef1; color:var(--muted);}

  .card{
    background:var(--card); border-radius:16px; box-shadow:var(--shadow);
    padding:16px; margin-bottom:12px;
  }
  .card .meta{color:var(--muted); font-size:12px; margin-bottom:4px;}
  .card .title{font-weight:700; font-size:15.5px; margin-bottom:4px;}
  .card .body{font-size:14px; line-height:1.45; white-space:pre-wrap; color:#3a3d42;}
  .card .row{display:flex; gap:8px; margin-top:12px;}
  .card .row > div{min-width:0;}

  button{font-family:inherit;}
  .btn{
    background:var(--accent); color:#fff; border:none; border-radius:12px;
    padding:11px 14px; font-size:14.5px; font-weight:700; cursor:pointer;
    transition: transform .08s, opacity .08s;
  }
  .btn:active{transform:scale(0.96); opacity:0.8;}
  .btn.secondary{background:#f1f2f4; color:var(--text);}
  .btn.ok{background:var(--ok);}
  .btn.danger{background:transparent; color:var(--danger); border:1px solid #f3caca; padding:9px 12px; font-size:13.5px;}
  .btn.small{padding:8px 12px; font-size:13.5px;}
  .btn.block{width:100%; padding:14px; font-size:15.5px; margin-top:4px;}

  input[type=text], input[type=date], input[type=number], textarea, select{
    width:100%; background:#f6f7f8; border:1px solid var(--border); color:var(--text);
    border-radius:12px; padding:12px; font-size:15px; margin-bottom:10px; font-family:inherit;
  }
  input[type=number]{ -moz-appearance:textfield; }
  input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button{
    -webkit-appearance:none; margin:0;
  }
  textarea{min-height:80px; resize:vertical;}
  label{font-size:12.5px; color:var(--muted); display:block; margin-bottom:5px; font-weight:600;}

  .empty{color:var(--muted); text-align:center; padding:36px 10px; font-size:14px;}
  .checkitem{
    display:flex; align-items:center; gap:12px; padding:14px;
    background:var(--card); box-shadow:var(--shadow); border-radius:14px; margin-bottom:8px;
    cursor:pointer; transition:background .15s, transform .08s; user-select:none;
  }
  .checkitem:active{transform:scale(.98);}
  .checkitem.done{background:#eaf7ee;}
  .check-circle{
    width:27px; height:27px; border-radius:50%; border:2px solid #cfd3d8; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:800; color:#fff;
    transition:background .15s, border-color .15s;
  }
  .checkitem.done .check-circle{background:var(--ok); border-color:var(--ok);}
  .checkitem .label{flex:1; font-size:14.5px;}
  .checkitem.done .label{text-decoration:line-through; color:var(--muted);}
  .del{background:none; border:none; color:#c4c8cd; font-size:19px; cursor:pointer; padding:2px 6px; flex-shrink:0;}
  .edit{background:none; border:none; color:#c4c8cd; font-size:17px; cursor:pointer; padding:2px 6px; flex-shrink:0;}
  .cc-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 14px; background:var(--card); border-bottom:1px solid var(--border);}
  .cc-row:first-child{border-radius:14px 14px 0 0;}
  .cc-row:last-child{border-radius:0 0 14px 14px; border-bottom:none;}
  .cc-row-name{flex:1; font-size:14px;}
  .cc-row-select{width:auto; max-width:180px; margin-bottom:0; font-size:12.5px; padding:8px 10px;}
  .ls-cat-icon{font-size:16px; flex-shrink:0; opacity:.85;}

  .list-spacer{height:20px;}

  #catalogoList{margin-top:4px;}
  .catalogo-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:11px 6px; border-bottom:1px solid var(--border); cursor:pointer; font-size:14px;
  }
  .catalogo-row:active{background:#f6f7f8;}
  .catalogo-row.selected{background:#eaf7ee;}
  .catalogo-plus{color:var(--accent); font-weight:800; font-size:16px; flex-shrink:0;}
  .catalogo-row.selected .catalogo-plus{color:var(--ok); font-size:18px;}

  .sort-toggle{display:flex; gap:8px; margin:4px 0 14px;}
  .sort-btn{
    flex:1; background:var(--card); border:1px solid var(--border); color:var(--muted);
    padding:9px 10px; border-radius:12px; font-size:13px; font-weight:700; cursor:pointer; box-shadow:var(--shadow);
  }
  .sort-btn.active{background:var(--accent); color:#fff; border-color:var(--accent);}

  .chart-wrap{position:relative; height:220px; margin-top:10px;}

  .fab-row{display:flex; gap:8px; margin-bottom:14px; margin-top:14px;}
  .status{font-size:12px; color:var(--muted); text-align:center; margin-top:24px;}
  .hidden{display:none !important;}

  .cat-header{
    display:flex; align-items:center; gap:8px; margin:20px 0 10px; padding:8px 14px;
    border-radius:12px; font-weight:800; font-size:14px; letter-spacing:0.2px;
  }
  .cat-header:first-child{margin-top:4px;}
  .cat-count{font-weight:600; font-size:12px; opacity:0.75;}

  .cat-edit-block{padding:12px 0; border-top:1px solid var(--border);}
  .cat-edit-block input[type=text]{margin-bottom:8px; font-size:15px;}
  .cat-edit-row2{display:flex; gap:8px; align-items:center;}
  .cat-edit-row2 select{flex:1; margin-bottom:0;}
  .cat-edit-row2 .del{flex-shrink:0; font-size:20px;}

  /* ── Sequenza di avvio: effetto "puzzle" sulle card della home ── */
  .frag-holder{position:relative;}
  .frag{position:absolute; opacity:0; overflow:hidden; will-change:transform,opacity;}
  .frag>.item{position:absolute; margin:0; pointer-events:none;}
  @keyframes fragIn{
    0%{opacity:0; transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.5);}
    60%{opacity:1;}
    100%{opacity:1; transform:translate(0,0) rotate(0) scale(1);}
  }
  .frag.play{animation:fragIn 360ms cubic-bezier(.2,.8,.2,1) forwards; animation-delay:var(--delay,0ms);}
  @media (prefers-reduced-motion: reduce){.frag{animation:none!important; opacity:1!important; transform:none!important;}}

  .credits{position:fixed; bottom:10px; right:14px; font-size:11px; color:var(--muted); font-family:monospace; z-index:5; background:rgba(255,255,255,0.85); padding:4px 10px; border-radius:20px; backdrop-filter:blur(4px);}

  .login-screen{position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:20px; z-index:100;}
  .login-card{background:var(--card); border-radius:20px; box-shadow:var(--shadow); padding:30px 24px; max-width:360px; width:100%;}
  .login-card h2{margin:0 0 6px; font-size:21px;}
  .login-card .sub{color:var(--muted); font-size:13.5px; margin:0 0 20px;}
  .login-error{color:var(--danger); font-size:13px; margin-bottom:10px; display:none; background:#fdeaea; padding:8px 10px; border-radius:8px;}
</style>

<style>
  .modal-overlay{position:fixed; inset:0; background:rgba(20,20,25,0.5); display:flex; align-items:center; justify-content:center; padding:20px; z-index:200;}
  .modal-box{background:var(--card); border-radius:18px; padding:22px 20px; max-width:340px; width:100%; box-shadow:0 12px 40px rgba(0,0,0,0.3);}
  .modal-message{font-size:15px; line-height:1.5; margin-bottom:20px; color:var(--text); white-space:pre-wrap; max-height:56vh; overflow-y:auto; text-align:left;}
  .modal-actions{display:flex; gap:10px; justify-content:flex-end;}
  .modal-actions .btn{padding:10px 18px; margin:0;}
</style>

<style>
  .result-overlay{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:300; background:rgba(20,20,25,0.4); padding:20px;}
  .result-content{background:var(--card); border-radius:22px; padding:34px 26px; text-align:center; box-shadow:0 16px 50px rgba(0,0,0,0.35); max-width:320px; width:100%; position:relative; z-index:2;}
  .result-icon{font-size:54px; margin-bottom:14px; line-height:1;}
  .result-message{font-size:15.5px; font-weight:700; color:var(--text); line-height:1.5; white-space:pre-wrap;}
  .result-overlay.warning .result-content{border:2px solid #f7c98a;}
  .result-particles{position:absolute; inset:0; pointer-events:none; overflow:visible;}
  .result-particle{position:absolute; left:50%; top:50%; font-size:24px; opacity:0; will-change:transform,opacity;}
  @keyframes particleBurst{
    0%{opacity:1; transform:translate(-50%,-50%) scale(.5) rotate(0deg);}
    100%{opacity:0; transform:translate(calc(-50% + var(--px)), calc(-50% + var(--py))) scale(1) rotate(var(--pr));}
  }
  .result-particle.play{animation:particleBurst 900ms ease-out forwards;}
  @media (prefers-reduced-motion: reduce){.result-particle{display:none;}}
</style>

<style>
  .activity-toast{
    position:fixed; top:16px; left:16px; right:16px; max-width:600px; margin:0 auto;
    background:var(--card); border-left:4px solid var(--accent); border-radius:14px;
    padding:14px 16px; box-shadow:0 10px 30px rgba(0,0,0,0.18); z-index:150;
    font-size:13.5px; font-weight:600; color:var(--text); white-space:pre-wrap; line-height:1.5;
    animation:toastIn 260ms ease-out; cursor:pointer;
  }
  @keyframes toastIn{ from{opacity:0; transform:translateY(-14px);} to{opacity:1; transform:translateY(0);} }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <h2>🚐 Il Mio Camper</h2>
    <div class="sub">Accedi per continuare</div>
    <div id="loginError" class="login-error"></div>
    <label>Email</label>
    <input type="text" id="login_email" placeholder="Email" autocomplete="username">
    <label>Password</label>
    <input type="password" id="login_password" placeholder="Password" autocomplete="current-password">
    <button class="btn block" onclick="doLogin()">Accedi</button>
  </div>
</div>

<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal-box">
    <div id="modalMessage" class="modal-message"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<div id="checklistResultOverlay" class="result-overlay hidden">
  <div class="result-particles" id="resultParticles"></div>
  <div class="result-content">
    <div class="result-icon" id="resultIcon"></div>
    <div class="result-message" id="resultMessage"></div>
  </div>
</div>

<div id="activityToast" class="activity-toast hidden">
  <div class="activity-toast-text" id="activityToastText"></div>
</div>

<div id="appRoot" class="hidden">
<header>
  <h1 id="pageTitle">🚐 Il Mio Camper</h1>
</header>
<div id="offlineBanner" class="offline-banner hidden">📴 Sei offline — i dati sono salvati sul telefono e si sincronizzano da soli quando torna il segnale</div>

<main id="main"></main>
<div class="credits">Il Mio Camper <span id="creditsVersione"></span></div>

<div id="bottomBar" class="bottom-bar">
  <button class="bb-nav-btn" id="backBtn">← Indietro</button>
  <button class="bb-nav-btn" id="homeBtn">🏠 Home</button>
  <div id="bottomBarAction"></div>
</div>
</div>

<script>
// ---------- Firebase setup ----------
const firebaseConfig = {
  apiKey: "AIzaSyCOYBM320R9EwwMkBWpLTHlEiBZA8gg02Q",
  authDomain: "camper-app-ccb86.firebaseapp.com",
  projectId: "camper-app-ccb86",
  storageBucket: "camper-app-ccb86.firebasestorage.app",
  messagingSenderId: "476280929219",
  appId: "1:476280929219:web:eda2af5900348b9333db76"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const COLLECTION = 'camperApp';

// Persistenza offline: i dati letti/scritti restano salvati sul telefono (IndexedDB)
// e si sincronizzano da soli con il server appena torna la connessione.
// Da qui in poi TUTTE le sGet/sSet dell'app funzionano anche senza campo.
db.enablePersistence({synchronizeTabs:true}).catch(err=>{
  if(err.code === 'failed-precondition'){
    console.warn('Persistenza offline non attiva: l\'app è aperta in più schede contemporaneamente.');
  } else if(err.code === 'unimplemented'){
    console.warn('Persistenza offline non supportata da questo browser.');
  }
});

// ---------- Banner offline: sempre visibile quando manca la connessione ----------
function aggiornaBannerOffline(){
  const banner = document.getElementById('offlineBanner');
  if(!banner) return;
  banner.classList.toggle('hidden', navigator.onLine);
}
window.addEventListener('online', ()=>{ aggiornaBannerOffline(); if(typeof prefetchAllData==='function') prefetchAllData(); });
window.addEventListener('offline', aggiornaBannerOffline);

// ---------- Autenticazione ----------
auth.onAuthStateChanged(user => {
  const loginScreen = document.getElementById('loginScreen');
  const appRoot = document.getElementById('appRoot');
  if(user){
    loginScreen.classList.add('hidden');
    appRoot.classList.remove('hidden');
    init();
  } else {
    loginScreen.classList.remove('hidden');
    appRoot.classList.add('hidden');
  }
});

async function doLogin(){
  const email = document.getElementById('login_email').value.trim();
  const password = document.getElementById('login_password').value;
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';
  if(!email || !password){
    errEl.textContent = 'Inserisci email e password.';
    errEl.style.display = 'block';
    return;
  }
  try{
    await auth.signInWithEmailAndPassword(email, password);
  }catch(e){
    errEl.textContent = 'Errore: ' + (e.code || e.message);
    errEl.style.display = 'block';
  }
}

// ---------- Storage helpers (Firestore-backed, shared tra i dispositivi) ----------
async function sGet(key, fallback){
  try{
    const snap = await db.collection(COLLECTION).doc(key).get();
    if(snap.exists){
      const data = snap.data();
      return data && data.value !== undefined ? data.value : fallback;
    }
    return fallback;
  }catch(e){
    // Se il tentativo normale fallisce (tipicamente offline senza una lettura recente),
    // proviamo esplicitamente la cache locale prima di arrenderci col fallback vuoto.
    try{
      const snapCache = await db.collection(COLLECTION).doc(key).get({source:'cache'});
      if(snapCache.exists){
        const data = snapCache.data();
        return data && data.value !== undefined ? data.value : fallback;
      }
    }catch(e2){ /* niente in cache locale */ }
    console.error('firestore get failed', key, e);
    return fallback;
  }
}
async function sSet(key, value){
  try{
    await db.collection(COLLECTION).doc(key).set({
      value,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  }catch(e){ console.error('firestore set failed', key, e); }
}

// ---------- Real-time listeners ----------
let activeListeners = {};
function watchKey(key){
  if(activeListeners[key]) return;
  let primoScatto = true;
  activeListeners[key] = db.collection(COLLECTION).doc(key).onSnapshot(()=>{
    if(primoScatto){ primoScatto = false; return; } // il primo scatto conferma solo i dati già caricati
    if(isTypingInForm()) return; // evita di cancellare un form che l'utente sta compilando
    render();
  }, err => console.error('listener error', key, err));
}
function unwatchAll(){
  Object.values(activeListeners).forEach(unsub => unsub());
  activeListeners = {};
}
function isTypingInForm(){
  const el = document.activeElement;
  if(!el) return false;
  const tag = el.tagName;
  return (tag==='INPUT' || tag==='TEXTAREA') && el.value && el.value.length>0;
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

// ---------- Popup di conferma/avviso personalizzati (al posto di confirm/alert nativi) ----------
function customConfirm(message){
  return new Promise(resolve=>{
    const overlay = document.getElementById('modalOverlay');
    document.getElementById('modalMessage').textContent = message;
    const actions = document.getElementById('modalActions');
    actions.innerHTML = '';
    const btnCancel = document.createElement('button');
    btnCancel.className = 'btn secondary';
    btnCancel.textContent = 'Annulla';
    const btnOk = document.createElement('button');
    btnOk.className = 'btn';
    btnOk.textContent = 'OK';
    actions.appendChild(btnCancel);
    actions.appendChild(btnOk);
    overlay.classList.remove('hidden');
    function cleanup(result){
      overlay.classList.add('hidden');
      btnCancel.removeEventListener('click', onCancel);
      btnOk.removeEventListener('click', onOk);
      resolve(result);
    }
    function onCancel(){ cleanup(false); }
    function onOk(){ cleanup(true); }
    btnCancel.addEventListener('click', onCancel);
    btnOk.addEventListener('click', onOk);
  });
}
function customAlert(message){
  return new Promise(resolve=>{
    const overlay = document.getElementById('modalOverlay');
    document.getElementById('modalMessage').textContent = message;
    const actions = document.getElementById('modalActions');
    actions.innerHTML = '';
    const btnOk = document.createElement('button');
    btnOk.className = 'btn block';
    btnOk.textContent = 'OK';
    actions.appendChild(btnOk);
    overlay.classList.remove('hidden');
    function cleanup(){
      overlay.classList.add('hidden');
      btnOk.removeEventListener('click', onOk);
      resolve();
    }
    function onOk(){ cleanup(); }
    btnOk.addEventListener('click', onOk);
  });
}
function todayStr(){ return new Date().toISOString().slice(0,10); }

function showChangelogModal(){
  const overlay = document.getElementById('modalOverlay');
  const msgEl = document.getElementById('modalMessage');
  msgEl.innerHTML = CHANGELOG.map(c=>`
    <div style="margin-bottom:12px;">
      <div style="font-weight:800; color:var(--accent); font-size:13.5px;">${c.v}</div>
      <div style="font-size:13.5px; color:#3a3d42; margin-top:2px;">${escapeHtml(c.note)}</div>
    </div>`).join('');
  const actions = document.getElementById('modalActions');
  actions.innerHTML = '';
  const btnOk = document.createElement('button');
  btnOk.className = 'btn block';
  btnOk.textContent = 'Chiudi';
  actions.appendChild(btnOk);
  overlay.classList.remove('hidden');
  function cleanup(){
    overlay.classList.add('hidden');
    btnOk.removeEventListener('click', onOk);
  }
  function onOk(){ cleanup(); }
  btnOk.addEventListener('click', onOk);
}


// ---------- Animazione "esplosione" per il risultato della verifica checklist ----------
function showChecklistResult(success, message){
  const overlay = document.getElementById('checklistResultOverlay');
  const icon = document.getElementById('resultIcon');
  const msg = document.getElementById('resultMessage');
  const particlesWrap = document.getElementById('resultParticles');
  particlesWrap.innerHTML = '';
  icon.textContent = success ? '🎉' : '⚠️';
  msg.textContent = message;
  overlay.classList.toggle('warning', !success);
  overlay.classList.remove('hidden');

  const emojiSet = success ? ['🎉','✅','🚐','⭐','🎊'] : ['⚠️','❗'];
  const count = success ? 18 : 10;
  for(let i=0; i<count; i++){
    const p = document.createElement('span');
    p.className = 'result-particle';
    p.textContent = emojiSet[Math.floor(Math.random()*emojiSet.length)];
    const angle = Math.random()*Math.PI*2;
    const dist = 90 + Math.random()*110;
    p.style.setProperty('--px', (Math.cos(angle)*dist)+'px');
    p.style.setProperty('--py', (Math.sin(angle)*dist)+'px');
    p.style.setProperty('--pr', ((Math.random()-0.5)*180)+'deg');
    p.style.animationDelay = (Math.random()*120)+'ms';
    particlesWrap.appendChild(p);
  }
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      particlesWrap.querySelectorAll('.result-particle').forEach(p=>p.classList.add('play'));
    });
  });

  overlay.onclick = () => overlay.classList.add('hidden');
  clearTimeout(showChecklistResult._t);
  showChecklistResult._t = setTimeout(()=> overlay.classList.add('hidden'), 3200);
}
function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'numeric'});
}

// Il nome resta su questo telefono/browser: ognuno imposta il proprio dal suo dispositivo,
// così l'app sa distinguere "chi ha fatto cosa" pur usando lo stesso account condiviso.
function getDeviceName(){

}
function setDeviceName(name){

  try{ return parseInt(localStorage.getItem('camper_last_seen_activity') || '0', 10); }catch(e){ return 0; }

// ---------- Registro attività condiviso (per la notifica "chi ha aggiunto cosa") ----------
async function logActivity(sezione, testo){
  const user = getDeviceName();
  if(!user) return; // se non hai impostato un nome su questo dispositivo, non attribuiamo l'azione
  try{
    const log = await sGet('activity_log', []);
    log.push({id:uid(), user, sezione, testo, ts: Date.now()});
    await sSet('activity_log', log.slice(-150));
  }catch(e){ console.error('logActivity failed', e); }
}
async function checkNewActivity(){
  const myName = getDeviceName();
  const lastSeen = getLastSeenActivity();
  const log = await sGet('activity_log', []);
  if(log.length === 0) return;
  const nuovi = log.filter(a => a.ts > lastSeen && a.user && a.user !== myName);
  if(nuovi.length > 0){
    const perUser = {};
    nuovi.forEach(a=>{
      if(!perUser[a.user]) perUser[a.user] = [];
      perUser[a.user].push(a.testo);
    });
    const messaggio = Object.entries(perUser).map(([user, testi])=>{
      const elenco = testi.slice(0,5).join(', ') + (testi.length>5 ? ` e altre ${testi.length-5}` : '');
      return `${user} ha aggiunto: ${elenco}`;
    }).join('\n');
    showActivityToast(messaggio);
  }
  const maxTs = log.reduce((m,a)=>Math.max(m,a.ts), lastSeen);
  setLastSeenActivity(maxTs);
}
function showActivityToast(message){
  const el = document.getElementById('activityToast');
  const textEl = document.getElementById('activityToastText');
  if(!el || !textEl) return;
  textEl.textContent = '🔔 ' + message;
  el.classList.remove('hidden');
  clearTimeout(showActivityToast._t);
  showActivityToast._t = setTimeout(()=> el.classList.add('hidden'), 7000);
  el.onclick = () => el.classList.add('hidden');
}

async function init(){

  prefetchAllData(); // in background: scarica tutto per averlo pronto anche offline

// Scarica in background TUTTI i dati dell'app (non solo la sezione aperta),
// così quando la connessione manca (es. dentro un supermercato) ogni sezione
// è già disponibile in locale, non solo quelle già visitate.
async function prefetchAllData(){
  if(!navigator.onLine) return;
  try{
    const keys = DATA_KEYS.slice();
    const customSections = await sGet('custom_sections', []);
    customSections.forEach(s => keys.push('custom_data_' + s.id));
    await Promise.all(keys.map(k => db.collection(COLLECTION).doc(k).get().catch(()=>{})));
  }catch(e){
    console.warn('Prefetch dati offline non completato', e);
  }
}

function navigate(route){
  unwatchAll();
  bottomBarAction.innerHTML = '';
  state.route = route;
  bottomBar.classList.toggle('show', route!=='home');
  render();
}

async function render(){
  if(state.route === 'home') return renderHome();
  if(state.route === 'catalogo_spesa') return renderCatalogoSpesa();
  if(state.route === 'catalogo_gestione') return renderGestioneCatalogo();
  if(state.route === 'viaggio_add') return renderViaggioAdd();
  if(state.route === 'viaggio_dettaglio') return renderViaggioDettaglio();
  if(state.route === 'spesa_viaggio_add') return renderSpesaViaggioAdd();
  if(state.route === 'spesa_viaggio_resto') return renderSpesaViaggioResto();
  if(state.route === 'diario_viaggio_dettaglio') return renderViaggioDiarioDettaglio();
  if(state.route === 'tappa_add') return renderTappaAdd();
  if(state.route === 'manut_todo_add') return renderManutTodoAdd();
  if(state.route === 'manut_done_add') return renderManutDoneAdd();
  const base = BASE_SECTIONS.find(s=>s.id===state.route);
  if(base) return renderBySection(base);
  const custom = state.customSections.find(s=>s.id===state.route);
  if(custom) return renderCustom(custom);
  navigate('home');
}

function renderHome(){
  pageTitle.textContent = '🚐 Il Mio Camper';
  watchKey('custom_sections');
  let items = BASE_SECTIONS.map(s=>({id:s.id, icon:s.icon, color:s.color, label:s.label, sub:s.sub}));
  state.customSections.forEach((s,i)=>{
    items.push({id:s.id, icon:s.icon||'📦', color:CUSTOM_COLORS[i%CUSTOM_COLORS.length], label:s.label, sub:'Sezione personalizzata'});
  });
  items = ordinaHomeItems(items);

  let html = '<div class="list">';
  items.forEach(it=>{
    html += itemHtml(it.id, it.icon, it.color, it.label, it.sub);
  });
  html += '</div>';
  html += `<div class="status">Tieni premuto un tasto per riordinarlo · Dati salvati automaticamente sul dispositivo</div>`;
  main.innerHTML = html;

  const cvEl = document.getElementById('creditsVersione');
  if(cvEl) cvEl.textContent = APP_VERSION;

  if(!homeAnimatedOnce){
    homeAnimatedOnce = true;
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        try{ assemblaHome(); }catch(e){ console.error('assembly error:', e); }
      });
    });
  }
  initHomeSortable();
}
function itemHtml(id, icon, color, label, sub){
  return `<button class="item" data-id="${id}" onclick="navigate('${id}')">
    <span class="badge" style="background:${color}">${icon}</span>
    <span class="txt"><div class="t">${escapeHtml(label)}</div><div class="s">${escapeHtml(sub||'')}</div></span>
    <span class="chev">›</span>
  </button>`;
}

// ---------- Ordine personalizzato della home (tieni premuto e trascina) ----------
function getHomeOrder(){
  try{
    const raw = localStorage.getItem('camper_home_order');
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveHomeOrder(order){
  try{ localStorage.setItem('camper_home_order', JSON.stringify(order)); }catch(e){}
}
function ordinaHomeItems(items){
  const order = getHomeOrder();
  if(order.length === 0) return items;
  const posMap = {};
  order.forEach((id,i)=>posMap[id]=i);
  return items.slice().sort((a,b)=>{
    const pa = posMap.hasOwnProperty(a.id) ? posMap[a.id] : Infinity;
    const pb = posMap.hasOwnProperty(b.id) ? posMap[b.id] : Infinity;
    return pa - pb;
  });
}
let homeSortable = null;
function initHomeSortable(){
  const listEl = document.querySelector('#main .list');
  if(!listEl || typeof Sortable === 'undefined') return;
  if(homeSortable){ try{ homeSortable.destroy(); }catch(e){} homeSortable = null; }
  homeSortable = new Sortable(listEl, {
    animation: 150,
    delay: 400,
    delayOnTouchOnly: true,
    touchStartThreshold: 6,
    onStart: function(){ if(navigator.vibrate) navigator.vibrate(30); },
    onEnd: function(){
      const ids = Array.from(listEl.children).map(el => el.dataset.id).filter(Boolean);
      saveHomeOrder(ids);
    }
  });
}

async function renderDiario(section){
  pageTitle.textContent = section.label;
  watchKey('viaggi');
  watchKey('diario_entries');
  const viaggi = await sGet('viaggi', []);
  const entries = await sGet('diario_entries', []);
  let html = '';
  if(viaggi.length===0){
    html += `<div class="empty">Nessun viaggio ancora. Aggiungi il tuo primo viaggio per iniziare il diario!</div>`;
  } else {
    const ordinati = viaggi.slice().sort((a,b)=> (b.dataInizio||'').localeCompare(a.dataInizio||''));
    ordinati.forEach(v=>{
      const tappe = entries.filter(e=>e.viaggioId===v.id);
      html += `<div class="card" style="cursor:pointer;" onclick="apriViaggioDiario('${v.id}')">

async function ensureDefaultChecklistCategories(){

  if(cats === null || cats.length === 0){
    cats = [
      {id:uid(), name:'Documenti essenziali', priority:'alta'},
      {id:uid(), name:'Generale', priority:'normale'}
    ];
    await sSet('checklist_categories', cats);
  }
  return cats;
}
function prioritaStile(priority){
  return priority === 'alta'
    ? {bg:'#fde0e0', icon:'🔴'}
    : {bg:'#dbeafe', icon:'🔵'};
}

let checklistEditingId = null;
async function renderChecklist(section){
  pageTitle.textContent = section.label;
  watchKey('checklist_items');
  watchKey('checklist_categories');
  const items = await sGet('checklist_items', []);
  const categorie = await ensureDefaultChecklistCategories();
  const catByName = {};
  categorie.forEach(c => catByName[c.name] = c);
  const ultimaCategoria = await sGet('checklist_last_category', null);

  let html = `<div class="fab-row">
      <button class="btn secondary small" onclick="resetChecklist()">🔄 Nuovo viaggio (resetta spunte)</button>
    </div>
    <div class="card">
      <label>Nuova voce checklist</label>
      <input type="text" id="c_text" placeholder="Es. Controllare gas, riempire acqua...">
      <label>Categoria</label>
      <select id="c_cat">
        ${categorie.map(c=>`<option value="${escapeHtml(c.name)}" ${c.name===ultimaCategoria?'selected':''}>${prioritaStile(c.priority).icon} ${escapeHtml(c.name)}</option>`).join('')}
      </select>
      <div class="body" style="margin:-2px 0 10px; font-size:12.5px;">Le categorie si aggiungono da Impostazioni.</div>
      <button class="btn block" onclick="addChecklistItem()">Aggiungi voce</button>
    </div>`;

  if(items.length===0){
    html += `<div class="empty">Nessuna voce. Crea la tua checklist di partenza.</div>`;
  } else {
    const sortMode = getChecklistSort();
    html += `<div class="sort-toggle">
      <button class="sort-btn ${sortMode==='stato'?'active':''}" onclick="setChecklistSort('stato')">☑️ Per stato</button>
      <button class="sort-btn ${sortMode==='alfa'?'active':''}" onclick="setChecklistSort('alfa')">🔤 A-Z</button>
    </div>`;
    const gruppi = {};
    items.forEach(it=>{
      const cat = it.category || 'Generale';
      if(!gruppi[cat]) gruppi[cat] = [];
      gruppi[cat].push(it);
    });
    const ordinePriorita = { alta:0, normale:1 };
    const nomiCategorie = Object.keys(gruppi).sort((a,b)=>{
      const pa = (catByName[a]?.priority) || 'normale';
      const pb = (catByName[b]?.priority) || 'normale';
      if(ordinePriorita[pa] !== ordinePriorita[pb]) return ordinePriorita[pa]-ordinePriorita[pb];
      return a.localeCompare(b);
    });
    nomiCategorie.forEach(cat=>{
      const list = ordinaArticoli(gruppi[cat], sortMode);
      const priority = (catByName[cat]?.priority) || 'normale';
      const stile = prioritaStile(priority);
      const fatti = list.filter(i=>i.done).length;
      html += `<div class="cat-header" style="background:${stile.bg}">
        <span>${stile.icon} ${escapeHtml(cat)}</span>
        <span class="cat-count">${fatti}/${list.length}</span>
      </div>`;
      list.forEach(it=>{
        if(checklistEditingId === it.id){
          html += `<div class="card">
            <div class="row" style="justify-content:space-between; align-items:flex-start; margin-bottom:6px;">
              <div class="title" style="margin:0;">Modifica voce</div>
              <button class="del" onclick="toggleChecklistEdit('${it.id}')">✕</button>
            </div>
            <label>Testo</label>
            <input type="text" id="ci_text_${it.id}" value="${escapeHtml(it.text)}">
            <label>Categoria</label>
            <select id="ci_cat_${it.id}">
              ${categorie.map(c=>`<option value="${escapeHtml(c.name)}" ${c.name===it.category?'selected':''}>${prioritaStile(c.priority).icon} ${escapeHtml(c.name)}</option>`).join('')}
            </select>
            <button class="btn block" onclick="salvaChecklistItem('${it.id}')">💾 Salva modifiche</button>
            <div class="row" style="margin-top:10px;">
              <button class="btn danger" onclick="delChecklistItem('${it.id}')">Elimina</button>
            </div>
          </div>`;
        } else {
          html += `<div class="checkitem ${it.done?'done':''}" onclick="toggleChecklistItem('${it.id}')">
            <span class="check-circle">${it.done?'✓':''}</span>
            <span class="label">${escapeHtml(it.text)}</span>
            <button class="edit" onclick="event.stopPropagation(); toggleChecklistEdit('${it.id}')">✏️</button>
            <button class="del" onclick="event.stopPropagation(); delChecklistItem('${it.id}')">🗑️</button>
          </div>`;
        }
      });
    });
    html += `<div class="list-spacer"></div>`;
  }
  main.innerHTML = html;

  bottomBarAction.innerHTML = items.length>0
    ? `<button class="btn block" onclick="verificaChecklist()">✅ Verifica checklist</button>`
    : '';
}
async function verificaChecklist(){
  const items = await sGet('checklist_items', []);
  if(items.length===0){
    await customAlert('Non hai ancora aggiunto nessuna voce alla checklist.');
    return;
  }
  const mancanti = items.filter(i=>!i.done);
  if(mancanti.length===0){
    showChecklistResult(true, 'Checklist completata!\nTutto pronto per partire 🚐');
  } else {
    const elenco = mancanti.slice(0,5).map(i=>'• '+i.text).join('\n');
    const extra = mancanti.length>5 ? `\n… e altre ${mancanti.length-5}` : '';
    showChecklistResult(false, `Mancano ancora ${mancanti.length} vo${mancanti.length===1?'ce':'ci'}:\n${elenco}${extra}`);
  }
}
async function addChecklistItem(){
  const text = document.getElementById('c_text').value.trim();
  const category = document.getElementById('c_cat').value;
  if(!text) return;
  const items = await sGet('checklist_items', []);
  const esistente = items.find(i => i.text.trim().toLowerCase() === text.toLowerCase());
  if(esistente){
    const messaggio = esistente.category === category
      ? `Esiste già "${esistente.text}" in questa categoria (${category}). Aggiungerla comunque?`
      : `Esiste già "${esistente.text}" nella categoria "${esistente.category}". Aggiungerla comunque in "${category}"?`;
    if(!(await customConfirm(messaggio))) return;
  }
  items.push({id:uid(), text, category, done:false});
  await sSet('checklist_items', items);
  await sSet('checklist_last_category', category);
  logActivity('Checklist', text);
  renderChecklist(BASE_SECTIONS[3]);
}
async function toggleChecklistItem(id){
  const items = await sGet('checklist_items', []);
  const it = items.find(i=>i.id===id);
  if(it) it.done = !it.done;
  await sSet('checklist_items', items);
  renderChecklist(BASE_SECTIONS[3]);
}
function toggleChecklistEdit(id){
  checklistEditingId = (checklistEditingId === id) ? null : id;
  renderChecklist(BASE_SECTIONS[3]);
}
async function salvaChecklistItem(id){
  const text = document.getElementById('ci_text_'+id).value.trim();
  const category = document.getElementById('ci_cat_'+id).value;
  if(!text){ await customAlert('Il testo della voce non può essere vuoto.'); return; }
  const items = await sGet('checklist_items', []);
  const esistente = items.find(i => i.id!==id && i.text.trim().toLowerCase() === text.toLowerCase());
  if(esistente){
    const messaggio = esistente.category === category
      ? `Esiste già "${esistente.text}" in questa categoria (${category}). Salvare comunque?`
      : `Esiste già "${esistente.text}" nella categoria "${esistente.category}". Salvare comunque in "${category}"?`;
    if(!(await customConfirm(messaggio))) return;
  }
  const it = items.find(i=>i.id===id);
  if(it){ it.text = text; it.category = category; }
  await sSet('checklist_items', items);
  checklistEditingId = null;
  renderChecklist(BASE_SECTIONS[3]);
}
async function delChecklistItem(id){
  if(!(await customConfirm('Eliminare definitivamente questa voce dalla checklist?'))) return;
  let items = await sGet('checklist_items', []);
  items = items.filter(i=>i.id!==id);
  await sSet('checklist_items', items);
  renderChecklist(BASE_SECTIONS[3]);
}
async function resetChecklist(){
  const items = await sGet('checklist_items', []);
  items.forEach(i=>i.done=false);
  await sSet('checklist_items', items);
  renderChecklist(BASE_SECTIONS[3]);

async function addChecklistCategory(){
  const nameEl = document.getElementById('cc_name');
  const prioEl = document.getElementById('cc_priority');
  const name = nameEl.value.trim();
  if(!name) return;
  const cats = await ensureDefaultChecklistCategories();
  if(cats.some(c=>c.name.toLowerCase() === name.toLowerCase())){
    await customAlert('Esiste già una categoria con questo nome.');
    return;
  }
  cats.push({id:uid(), name, priority: prioEl.value});
  await sSet('checklist_categories', cats);
  renderSettings(BASE_SECTIONS.find(s=>s.type==='settings'));
}
async function saveAllChecklistCategories(){
  const nameInputs = document.querySelectorAll('.cat-edit-name');
  if(nameInputs.length === 0) return;

  const valori = Array.from(nameInputs).map(inp => ({
    id: inp.dataset.id,
    oldName: inp.dataset.old,
    newName: inp.value.trim(),
    priority: document.querySelector(`.cat-edit-prio[data-id="${inp.dataset.id}"]`).value
  }));

  if(valori.some(v => !v.newName)){
    await customAlert('Il nome delle categorie non può essere vuoto.');
    return;
  }
  const nomiMinuscoli = valori.map(v => v.newName.toLowerCase());
  const haDuplicati = nomiMinuscoli.some((n, i) => nomiMinuscoli.indexOf(n) !== i);
  if(haDuplicati){
    await customAlert('Due categorie non possono avere lo stesso nome.');
    return;
  }

  const cats = await sGet('checklist_categories', []);
  const renameMap = {};
  valori.forEach(v => {
    const cat = cats.find(c => c.id === v.id);
    if(cat){
      if(v.oldName !== v.newName) renameMap[v.oldName] = v.newName;
      cat.name = v.newName;
      cat.priority = v.priority;
    }
  });
  await sSet('checklist_categories', cats);

  if(Object.keys(renameMap).length > 0){
    const items = await sGet('checklist_items', []);
    let changed = false;
    items.forEach(it => {
      if(renameMap[it.category]){ it.category = renameMap[it.category]; changed = true; }
    });
    if(changed) await sSet('checklist_items', items);
  }

  await customAlert('Modifiche salvate.');
  renderSettings(BASE_SECTIONS.find(s=>s.type==='settings'));
}
async function delChecklistCategory(id){
  if(!(await customConfirm('Eliminare questa categoria? Le voci checklist che la usano diventeranno "Generale".'))) return;
  let cats = await sGet('checklist_categories', []);
  cats = cats.filter(c=>c.id!==id);
  await sSet('checklist_categories', cats);
  renderSettings(BASE_SECTIONS.find(s=>s.type==='settings'));
}

    });
    if(changed) await sSet('lista_spesa_items', items);

    const overrides = await sGet('catalogo_categoria_overrides', {});
    let overridesChanged = false;
    Object.keys(overrides).forEach(nome => {
      if(renameMap[overrides[nome]]){ overrides[nome] = renameMap[overrides[nome]]; overridesChanged = true; }
    });
    if(overridesChanged) await sSet('catalogo_categoria_overrides', overrides);
  }

  await customAlert('Modifiche salvate.');
  renderSettings(BASE_SECTIONS.find(s=>s.type==='settings'));
}
async function delListaSpesaCategoria(id){
  if(!(await customConfirm('Eliminare questa categoria? Gli articoli della lista spesa che la usano diventeranno "Altro".'))) return;
  let cats = await sGet('lista_spesa_categorie', []);
  const cat = cats.find(c=>c.id===id);
  cats = cats.filter(c=>c.id!==id);
  await sSet('lista_spesa_categorie', cats);

  if(cat){
    const items = await sGet('lista_spesa_items', []);
    let changed = false;
    items.forEach(it => { if(it.category===cat.name){ it.category='Altro'; changed=true; } });
    if(changed) await sSet('lista_spesa_items', items);

    const overrides = await sGet('catalogo_categoria_overrides', {});
    let overridesChanged = false;
    Object.keys(overrides).forEach(nome => {
      if(overrides[nome]===cat.name){ delete overrides[nome]; overridesChanged = true; }
    });
    if(overridesChanged) await sSet('catalogo_categoria_overrides', overrides);
  }
  renderSettings(BASE_SECTIONS.find(s=>s.type==='settings'));
}

    ];

function colorePerCategoria(cat){
  if(CAT_COLORS[cat]) return CAT_COLORS[cat];
  let hash = 0;
  for(let i=0;i<cat.length;i++) hash = cat.charCodeAt(i) + ((hash<<5)-hash);
  return CUSTOM_COLORS[Math.abs(hash) % CUSTOM_COLORS.length];
}
function iconaPerCategoria(cat, listaCategorie){
  const found = (listaCategorie||[]).find(c=>c.name===cat);
  return found ? found.icon : '📦';
}

let currentFrequenti = [];
function calcolaFrequenti(storico, limit=10){
  const map = {};
  storico.forEach(s=>{
    const key = (s.text||'').toLowerCase() + '|' + (s.category||'Altro');
    if(!map[key]) map[key] = {text:s.text, category:s.category||'Altro', count:0};
    map[key].count++;
  });
  return Object.values(map).sort((a,b)=>b.count-a.count).slice(0,limit);
}

// Da qui in poi gli articoli vivono su Firestore (chiave 'catalogo_articoli') e sono gestibili da Impostazioni.
async function ensureCatalogoArticoli(){
  let arts = await sGet('catalogo_articoli', null);
  if(arts === null || arts.length === 0){
    const overrides = await sGet('catalogo_categoria_overrides', {}); // migrazione da versioni precedenti
    arts = CATALOGO_SPESA.map(item => ({
      id: uid(),
      nome: item.n,
      categoria: overrides[item.n] || item.c
    }));
    await sSet('catalogo_articoli', arts);
  }
  return arts;
}

let catalogoSelezionati = new Set();
let catalogoArticoliPickerCache = [];
let catalogoFiltroCategoria = '';

async function renderCatalogoSpesa(){
  pageTitle.textContent = 'Catalogo articoli';
  catalogoSelezionati.clear();
  catalogoFiltroCategoria = '';
  catalogoArticoliPickerCache = await ensureCatalogoArticoli();
  const categorie = await ensureDefaultListaSpesaCategorie();
  const html = `
    <div class="card">
      <label>Filtra per categoria (opzionale)</label>
      <select id="catalogo_cat_filter" onchange="onCatalogoFiltroChange()">
        <option value="">Tutte le categorie</option>
        ${categorie.map(c=>`<option value="${escapeHtml(c.name)}">${c.icon} ${escapeHtml(c.name)}</option>`).join('')}
      </select>
      <label style="margin-top:10px;">Cerca nel catalogo</label>
      <input type="text" id="catalogo_search" placeholder="Es. detersivo, pane..." oninput="renderCatalogoFiltrato()">
      <div class="body" style="margin:8px 0 0; font-size:12.5px;">Tocca gli articoli che ti servono (puoi selezionarne più di uno): ognuno finisce da solo nella categoria giusta. Poi premi "Aggiungi" in basso.</div>
    </div>
    <div id="catalogoList"></div>
    <div class="list-spacer"></div>
  `;
  main.innerHTML = html;
  renderCatalogoFiltrato();
}
function onCatalogoFiltroChange(){
  catalogoFiltroCategoria = document.getElementById('catalogo_cat_filter').value;
  renderCatalogoFiltrato();
}
function renderCatalogoFiltrato(){
  const q = document.getElementById('catalogo_search').value.trim().toLowerCase();
  const listEl = document.getElementById('catalogoList');
  let risultati = catalogoArticoliPickerCache;
  if(catalogoFiltroCategoria) risultati = risultati.filter(it => it.categoria===catalogoFiltroCategoria);
  if(q) risultati = risultati.filter(it => it.nome.toLowerCase().includes(q));
  risultati = risultati.slice().sort((a,b)=>a.nome.localeCompare(b.nome,'it'));
  if(risultati.length===0){
    listEl.innerHTML = `<div class="empty" style="padding:16px 4px;">Nessun articolo trovato.</div>`;
  } else {
    listEl.innerHTML = risultati.map((item,idx)=>{
      const selezionato = catalogoSelezionati.has(item.nome);
      return `<div class="catalogo-row ${selezionato?'selected':''}" onclick="toggleCatalogoSelezione(${idx})">
        <span>${escapeHtml(item.nome)}</span><span class="catalogo-plus">${selezionato?'✓':'＋'}</span>
      </div>`;
    }).join('');
  }
  listEl._risultati = risultati;
  aggiornaBarraCatalogo();
}
function toggleCatalogoSelezione(idx){
  const listEl = document.getElementById('catalogoList');
  const item = listEl._risultati[idx];
  if(!item) return;
  if(catalogoSelezionati.has(item.nome)) catalogoSelezionati.delete(item.nome);
  else catalogoSelezionati.add(item.nome);
  renderCatalogoFiltrato();
}
function aggiornaBarraCatalogo(){
  const n = catalogoSelezionati.size;
  bottomBarAction.innerHTML = n > 0
    ? `<button class="btn block" onclick="confermaAggiuntaCatalogo()">➕ Aggiungi ${n} articol${n===1?'o':'i'}</button>`
    : '';
}
async function confermaAggiuntaCatalogo(){
  if(catalogoSelezionati.size === 0) return;
  const items = await sGet('lista_spesa_items', []);
  let aggiunti = 0, duplicati = 0;
  catalogoSelezionati.forEach(nome=>{
    const catalogoItem = catalogoArticoliPickerCache.find(c=>c.nome===nome);
    const categoria = catalogoItem ? catalogoItem.categoria : 'Altro';
    const giaPresente = items.some(i => !i.done && i.text.toLowerCase()===nome.toLowerCase());
    if(giaPresente){ duplicati++; return; }
    items.push({id:uid(), text:nome, category:categoria, done:false});
    logActivity('Lista della spesa', nome);
    aggiunti++;
  });
  await sSet('lista_spesa_items', items);
  catalogoSelezionati.clear();
  let msg = `✅ Aggiunti ${aggiunti} articoli, ognuno nella sua categoria.`;
  if(duplicati>0) msg += `\n${duplicati} erano già in lista, saltati.`;
  await customAlert(msg);
  renderCatalogoFiltrato();
}

async function aggiungiArticoloCatalogo(){
  const nomeEl = document.getElementById('ga_nome');
  const nome = nomeEl.value.trim();
  const categoria = document.getElementById('ga_cat').value;
  if(!nome) return;
  if(catalogoArticoliCache.some(a=>a.nome.toLowerCase()===nome.toLowerCase())){
    await customAlert('Esiste già un articolo con questo nome nel catalogo.');
    return;
  }
  catalogoArticoliCache.push({id:uid(), nome, categoria});
  await sSet('catalogo_articoli', catalogoArticoliCache);
  nomeEl.value = '';
  const labelEl = document.getElementById('ga_search_label');
  if(labelEl) labelEl.textContent = `Cerca nel catalogo (${catalogoArticoliCache.length} articoli)`;
  renderGestioneCatalogoList();
}
async function salvaArticoloCatalogo(id){
  const nome = document.getElementById('art_nome_'+id).value.trim();
  const categoria = document.getElementById('art_cat_'+id).value;
  if(!nome){ await customAlert('Il nome dell\'articolo non può essere vuoto.'); return; }
  const a = catalogoArticoliCache.find(x=>x.id===id);
  if(a){ a.nome = nome; a.categoria = categoria; }
  await sSet('catalogo_articoli', catalogoArticoliCache);
  catalogoArticoloEditingId = null;
  renderGestioneCatalogoList();
}
async function delArticoloCatalogo(id){
  if(!(await customConfirm('Eliminare questo articolo dal catalogo? Non sarà più selezionabile per aggiunte rapide alla lista spesa.'))) return;
  catalogoArticoliCache = catalogoArticoliCache.filter(a=>a.id!==id);
  await sSet('catalogo_articoli', catalogoArticoliCache);
  catalogoArticoloEditingId = null;
  const labelEl = document.getElementById('ga_search_label');
  if(labelEl) labelEl.textContent = `Cerca nel catalogo (${catalogoArticoliCache.length} articoli)`;
  renderGestioneCatalogoList();
}

function getListaSpesaSort(){
  try{ return localStorage.getItem('camper_ls_sort') || 'stato'; }catch(e){ return 'stato'; }
}
function setListaSpesaSort(modo){
  try{ localStorage.setItem('camper_ls_sort', modo); }catch(e){}
  renderListaSpesa(BASE_SECTIONS.find(s=>s.type==='lista_spesa'));
}
function ordinaArticoli(list, modo){
  const arr = list.slice();
  if(modo === 'alfa'){
    arr.sort((a,b)=> a.text.localeCompare(b.text, 'it', {sensitivity:'base'}));
  } else {
    arr.sort((a,b)=> (a.done === b.done) ? 0 : (a.done ? 1 : -1));
  }
  return arr;
}

}

}


async function renderListaSpesa(section){

  const storico = await sGet('lista_spesa_storico', []);
  currentFrequenti = calcolaFrequenti(storico);
  const categorie = await ensureDefaultListaSpesaCategorie();
  const sortMode = getListaSpesaSort();

  let html = `
    <div class="card">
      <label>Articolo</label>
      <input type="text" id="ls_text" placeholder="Es. Pane, detersivo piatti...">
      <label>Categoria</label>
      <select id="ls_cat_select" onchange="onCategoriaLSChange()">
        ${categorie.map(c=>`<option value="${escapeHtml(c.name)}">${c.icon} ${escapeHtml(c.name)}</option>`).join('')}

      </select>

    </div>

    <div class="card">
      <button class="btn secondary block" onclick="navigate('catalogo_spesa')">📚 Aggiungi dal catalogo articoli</button>
    </div>`;

  if(currentFrequenti.length > 0){
    html += `<div class="card">
      <div class="title">🔁 Acquistati spesso</div>
      <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;">
        ${currentFrequenti.map((f,idx)=>`<button class="btn secondary small" onclick="quickAddFromStorico(${idx})">+ ${escapeHtml(f.text)}</button>`).join('')}
      </div>
    </div>`;
  }

  if(items.length>0){
    html += `<div class="sort-toggle">
      <button class="sort-btn ${sortMode==='stato'?'active':''}" onclick="setListaSpesaSort('stato')">☑️ Per stato</button>
      <button class="sort-btn ${sortMode==='alfa'?'active':''}" onclick="setListaSpesaSort('alfa')">🔤 A-Z</button>
    </div>`;
  }

  if(items.length===0){
    html += `<div class="empty">Lista vuota. Aggiungi il primo articolo!</div>`;
  } else {
    const gruppi = {};
    items.forEach(it=>{
      const cat = it.category || 'Altro';
      if(!gruppi[cat]) gruppi[cat] = [];
      gruppi[cat].push(it);
    });
    Object.keys(gruppi).sort().forEach(cat=>{
      const list = ordinaArticoli(gruppi[cat], sortMode);
      const presi = list.filter(i=>i.done).length;
      html += `<div class="cat-header" style="background:${colorePerCategoria(cat)}">
        <span>${iconaPerCategoria(cat, categorie)} ${escapeHtml(cat)}</span>
        <span class="cat-count">${presi}/${list.length}</span>
      </div>`;
      list.forEach(it=>{
        html += `<div class="checkitem ${it.done?'done':''}" onclick="toggleListaSpesa('${it.id}')">
          <span class="check-circle">${it.done?'✓':''}</span>
          <span class="label">${escapeHtml(it.text)}</span>

          <button class="del" onclick="event.stopPropagation(); delListaSpesa('${it.id}')">🗑️</button>
        </div>`;
      });
    });
    html += `<div class="list-spacer"></div>`;
  }
  main.innerHTML = html;

  bottomBarAction.innerHTML = items.length>0
    ? `<button class="btn block" onclick="chiudiSpesa()">✅ Chiudi spesa</button>`
    : '';
}
async function quickAddFromStorico(idx){
  const f = currentFrequenti[idx];
  if(!f) return;
  const items = await sGet('lista_spesa_items', []);
  const giaPresente = items.some(i => !i.done && i.text.toLowerCase()===f.text.toLowerCase() && (i.category||'Altro')===(f.category||'Altro'));
  if(giaPresente){
    await customAlert(`"${f.text}" è già nella lista.`);
    return;
  }
  items.push({id:uid(), text:f.text, category:f.category||'Altro', done:false});
  await sSet('lista_spesa_items', items);
  renderListaSpesa(BASE_SECTIONS.find(s=>s.type==='lista_spesa'));
}
async function chiudiSpesa(){
  const items = await sGet('lista_spesa_items', []);
  const acquistati = items.filter(i=>i.done);
  if(acquistati.length===0){
    await customAlert('Non ci sono ancora articoli spuntati come acquistati.');
    return;
  }
  if(!(await customConfirm(`Salvare ${acquistati.length} articoli nello storico acquisti e rimuoverli dalla lista? Resteranno solo quelli ancora da comprare.`))) return;
  const storico = await sGet('lista_spesa_storico', []);
  const oggi = todayStr();
  acquistati.forEach(it => storico.push({id:uid(), text:it.text, category:it.category||'Altro', data:oggi}));
  await sSet('lista_spesa_storico', storico.slice(-300));
  const restanti = items.filter(i=>!i.done);
  await sSet('lista_spesa_items', restanti);
  renderListaSpesa(BASE_SECTIONS.find(s=>s.type==='lista_spesa'));
}

async function addListaSpesa(){
  const text = document.getElementById('ls_text').value.trim();
  const sel = document.getElementById('ls_cat_select').value;
  let category = sel;
  if(sel === '__nuova__'){
    category = document.getElementById('ls_cat_custom').value.trim() || 'Altro';
    const cats = await ensureDefaultListaSpesaCategorie();
    if(!cats.some(c=>c.name.toLowerCase()===category.toLowerCase())){
      cats.push({id:uid(), name:category, icon:'📦'});
      await sSet('lista_spesa_categorie', cats);
    }
  }
  if(!text) return;
  const items = await sGet('lista_spesa_items', []);
  items.push({id:uid(), text, category, done:false});
  await sSet('lista_spesa_items', items);
  logActivity('Lista della spesa', text);
  renderListaSpesa(BASE_SECTIONS.find(s=>s.type==='lista_spesa'));
}

  await sSet('lista_spesa_items', items);

function passaPeriodo(dateStr, periodo){
  if(!dateStr) return false;
  if(periodo === 'tutto') return true;
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d)) return false;
  const now = new Date();
  if(periodo === 'mese'){
    const limite = new Date(); limite.setDate(now.getDate()-30);
    return d >= limite;
  }
  if(periodo === '3mesi'){
    const limite = new Date(); limite.setDate(now.getDate()-90);
    return d >= limite;
  }
  if(periodo === 'anno'){
    return d.getFullYear() === now.getFullYear();
  }
  if(periodo.startsWith('anno:')){
    return d.getFullYear() === parseInt(periodo.slice(5), 10);
  }
  return true;
}
const MESI_BREVI = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
function raggruppaPerMese(items, dateField, valueField){
  const map = {};
  items.forEach(it=>{
    const d = it[dateField];
    if(!d) return;
    const dt = new Date(d+'T00:00:00');
    if(isNaN(dt)) return;
    const key = dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');
    if(!map[key]) map[key] = 0;
    map[key] += valueField ? (Number(it[valueField])||0) : 1;
  });
  const keys = Object.keys(map).sort();
  const labels = keys.map(k=>{
    const [y,m] = k.split('-');
    return MESI_BREVI[parseInt(m,10)-1] + ' ' + y.slice(2);
  });
  const values = keys.map(k=>map[k]);
  return {labels, values};
}

let graficiChartInstances = [];
function distruggiGraficiChart(){
  graficiChartInstances.forEach(c=>{ try{ c.destroy(); }catch(e){} });
  graficiChartInstances = [];
}
function disegnaBarre(canvasId, wrapId, items, dateField, valueField, label, color, emptyMsg){
  const conDati = items.filter(it=>it[dateField]);
  if(conDati.length===0){
    document.getElementById(wrapId).innerHTML = `<div class="empty" style="padding:20px 4px;">${emptyMsg}</div>`;
    return;
  }
  const {labels, values} = raggruppaPerMese(conDati, dateField, valueField);
  const ctx = document.getElementById(canvasId).getContext('2d');
  const chart = new Chart(ctx, {
    type:'bar',
    data:{ labels, datasets:[{ label, data: values, backgroundColor: color, borderRadius:6 }] },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false} },
      scales:{ y:{ beginAtZero:true, ticks:{precision:0} } }
    }
  });
  graficiChartInstances.push(chart);
}
function disegnaLineaKm(items, periodo){

    nome: v.nome,
    totale: speseFiltrate.filter(s=>s.viaggioId===v.id).reduce((sum,s)=>sum+importoTotaleSpesa(s),0)

      indexAxis:'y', responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false} },
      scales:{ x:{ beginAtZero:true } }

function disegnaTortaPagamenti(canvasId, wrapId, speseFiltrate, emptyMsg){
  const totali = {};
  speseFiltrate.forEach(s=>{
    const p1 = s.pagamento || 'contanti';
    totali[p1] = (totali[p1]||0) + (Number(s.importo)||0);
    if(s.pagamentoResto && Number(s.importoResto)>0){
      totali[s.pagamentoResto] = (totali[s.pagamentoResto]||0) + Number(s.importoResto);
    }
  });
  const chiavi = Object.keys(totali).filter(k=>totali[k]>0);
  if(chiavi.length===0){
    document.getElementById(wrapId).innerHTML = `<div class="empty" style="padding:20px 4px;">${emptyMsg}</div>`;
    return;
  }
  const coloriPagamento = { contanti:'#5cb85c', bancomat:'#4a9de8', buoni:'#e8a83c', buoni_spesa:'#e0507a' };
  const ctx = document.getElementById(canvasId).getContext('2d');
  const chart = new Chart(ctx, {
    type:'doughnut',
    data:{
      labels: chiavi.map(k=>labelPagamento(k)),
      datasets:[{ data: chiavi.map(k=>totali[k]), backgroundColor: chiavi.map(k=>coloriPagamento[k]||'#ccc') }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ position:'bottom', labels:{ boxWidth:14, font:{size:12} } } }
    }
  });
  graficiChartInstances.push(chart);
}

const PALETTE_CATEGORIE = ['#e0507a','#4a9de8','#e8a83c','#5cb85c','#8b6fd6','#e8834a','#3cbcb0','#c45cc4'];
function disegnaTortaCategorie(canvasId, wrapId, speseFiltrate, categorie, emptyMsg){
  const totali = {};
  speseFiltrate.forEach(s=>{
    const cat = s.categoria || 'Altro';

  });

  }

    type:'doughnut',

      plugins:{ legend:{ position:'bottom', labels:{ boxWidth:14, font:{size:12} } } }

async function renderGrafici(section){
  pageTitle.textContent = section.label;
  const periodo = getGraficiPeriodo();
  const viaggioSelezionato = getGraficiViaggio();
  const done = await sGet('manut_done', []);
  const diario = await sGet('diario_entries', []);
  const spese = await sGet('spese_viaggio', []);
  const viaggi = await sGet('viaggi', []);
  const categorieSpese = await ensureDefaultSpeseViaggioCategorie();

  const doneFiltrati = done.filter(t => passaPeriodo(t.date, periodo));
  const diarioFiltrati = diario.filter(t => passaPeriodo(t.date, periodo));
  const speseFiltrate = spese.filter(t => passaPeriodo(t.data, periodo));
  // Sottoinsieme filtrato anche per il viaggio scelto (usato dai grafici che analizzano un singolo viaggio)
  const speseFiltrateViaggio = viaggioSelezionato
    ? speseFiltrate.filter(s => s.viaggioId === viaggioSelezionato)
    : speseFiltrate;
  const nomeViaggioSelezionato = viaggioSelezionato ? (viaggi.find(v=>v.id===viaggioSelezionato)?.nome || '') : '';

  // Anni presenti nei dati (per poter scegliere un anno specifico, non solo quello corrente)
  const anniTrovati = new Set();
  [...done, ...diario].forEach(t=>{
    if(!t.date) return;
    const d = new Date(t.date+'T00:00:00');
    if(!isNaN(d)) anniTrovati.add(d.getFullYear());
  });
  spese.forEach(t=>{
    if(!t.data) return;
    const d = new Date(t.data+'T00:00:00');
    if(!isNaN(d)) anniTrovati.add(d.getFullYear());
  });
  const anniOrdinati = [...anniTrovati].sort((a,b)=>b-a);
  const viaggiOrdinati = viaggi.slice().sort((a,b)=> (b.dataInizio||'').localeCompare(a.dataInizio||''));

  let html = `
    <div class="card">
      <label>Periodo da visualizzare</label>
      <select id="grafici_periodo" onchange="setGraficiPeriodo(this.value)">
        <option value="mese" ${periodo==='mese'?'selected':''}>Ultimo mese</option>
        <option value="3mesi" ${periodo==='3mesi'?'selected':''}>Ultimi 3 mesi</option>
        <option value="anno" ${periodo==='anno'?'selected':''}>Anno corrente</option>
        <option value="tutto" ${periodo==='tutto'?'selected':''}>Tutto</option>
        ${anniOrdinati.map(y=>`<option value="anno:${y}" ${periodo==='anno:'+y?'selected':''}>Anno ${y}</option>`).join('')}

function iconaPagamento(p){
  if(p==='bancomat') return '💳';
  if(p==='buoni') return '🎫';
  if(p==='buoni_spesa') return '🛍️';
  return '💵';
}
function labelPagamento(p){
  if(p==='bancomat') return 'Bancomat';
  if(p==='buoni') return 'Buoni carburante';
  if(p==='buoni_spesa') return 'Buoni spesa';
  return 'Contanti';
}
function importoTotaleSpesa(s){
  return (Number(s.importo)||0) + (Number(s.importoResto)||0);
}
function descrizionePagamento(s){
  if(s.pagamentoResto && Number(s.importoResto)>0){
    return `${iconaPagamento(s.pagamento)} ${labelPagamento(s.pagamento)} €${(Number(s.importo)||0).toFixed(2)} + ${iconaPagamento(s.pagamentoResto)} ${labelPagamento(s.pagamentoResto)} €${(Number(s.importoResto)||0).toFixed(2)}`;
  }
  return `${iconaPagamento(s.pagamento)} ${labelPagamento(s.pagamento)}`;
}
async function ensureDefaultSpeseViaggioCategorie(){
  let cats = await sGet('spese_viaggio_categorie', null);
  if(cats === null || cats.length === 0){
    cats = [
      {id:uid(), name:'Carburante', icon:'⛽'},
      {id:uid(), name:'Cibo', icon:'🍽️'},
      {id:uid(), name:'Pedaggi', icon:'🛣️'},
      {id:uid(), name:'Sosta/Campeggio', icon:'⛺'},
      {id:uid(), name:'Attività', icon:'🎟️'},
      {id:uid(), name:'Altro', icon:'📦'}
    ];
    await sSet('spese_viaggio_categorie', cats);
  }
  return cats;
}

async function salvaSpesaViaggio(id){
  const descrizione = document.getElementById('sp_desc_'+id).value.trim();
  const importo = parseFloat(document.getElementById('sp_importo_'+id).value) || 0;
  const data = document.getElementById('sp_data_'+id).value || todayStr();
  const categoria = document.getElementById('sp_cat_'+id).value;
  const pagamento = document.getElementById('sp_pagamento_'+id).value;
  let pagamentoResto = null, importoResto = 0;
  if(pagamento === 'buoni_spesa'){
    pagamentoResto = document.getElementById('sp_pagamento_resto_'+id).value;
    importoResto = parseFloat(document.getElementById('sp_importo_resto_'+id).value) || 0;
  }
  const spese = await sGet('spese_viaggio', []);
  const s = spese.find(x=>x.id===id);
  if(s){ s.descrizione = descrizione; s.importo = importo; s.data = data; s.categoria = categoria; s.pagamento = pagamento; s.pagamentoResto = pagamentoResto; s.importoResto = importoResto; }
  await sSet('spese_viaggio', spese);
  speseViaggioEditingId = null;
  renderViaggioDettaglio();
}

async function addSpeseViaggioCategoria(){
  const nameEl = document.getElementById('svc_name');
  const iconEl = document.getElementById('svc_icon');
  const name = nameEl.value.trim();
  if(!name) return;
  const icon = iconEl.value.trim() || '📦';
  const cats = await ensureDefaultSpeseViaggioCategorie();
  if(cats.some(c=>c.name.toLowerCase() === name.toLowerCase())){
    await customAlert('Esiste già una categoria con questo nome.');
    return;
  }
  cats.push({id:uid(), name, icon});
  await sSet('spese_viaggio_categorie', cats);
  renderSettings(BASE_SECTIONS.find(s=>s.type==='settings'));
}
async function saveAllSpeseViaggioCategorie(){
  const nameInputs = document.querySelectorAll('.svc-edit-name');
  if(nameInputs.length === 0) return;

  const valori = Array.from(nameInputs).map(inp => ({
    id: inp.dataset.id,
    oldName: inp.dataset.old,
    newName: inp.value.trim(),
    icon: document.querySelector(`.svc-edit-icon[data-id="${inp.dataset.id}"]`).value.trim() || '📦'
  }));

  if(valori.some(v => !v.newName)){
    await customAlert('Il nome delle categorie non può essere vuoto.');
    return;
  }
  const nomiMinuscoli = valori.map(v => v.newName.toLowerCase());
  const haDuplicati = nomiMinuscoli.some((n, i) => nomiMinuscoli.indexOf(n) !== i);
  if(haDuplicati){
    await customAlert('Due categorie non possono avere lo stesso nome.');
    return;
  }

  const cats = await sGet('spese_viaggio_categorie', []);
  const renameMap = {};
  valori.forEach(v => {
    const cat = cats.find(c => c.id === v.id);
    if(cat){
      if(v.oldName !== v.newName) renameMap[v.oldName] = v.newName;
      cat.name = v.newName;
      cat.icon = v.icon;
    }
  });
  await sSet('spese_viaggio_categorie', cats);

  if(Object.keys(renameMap).length > 0){
    const spese = await sGet('spese_viaggio', []);
    let changed = false;
    spese.forEach(s => {
      if(renameMap[s.categoria]){ s.categoria = renameMap[s.categoria]; changed = true; }
    });
    if(changed) await sSet('spese_viaggio', spese);
  }

  await customAlert('Modifiche salvate.');
  renderSettings(BASE_SECTIONS.find(s=>s.type==='settings'));
}
async function delSpeseViaggioCategoria(id){
  if(!(await customConfirm('Eliminare questa categoria? Le spese che la usano diventeranno "Altro".'))) return;
  let cats = await sGet('spese_viaggio_categorie', []);
  const cat = cats.find(c=>c.id===id);
  cats = cats.filter(c=>c.id!==id);
  await sSet('spese_viaggio_categorie', cats);

  if(cat){
    const spese = await sGet('spese_viaggio', []);
    let changed = false;
    spese.forEach(s => { if(s.categoria===cat.name){ s.categoria='Altro'; changed=true; } });
    if(changed) await sSet('spese_viaggio', spese);
  }
  renderSettings(BASE_SECTIONS.find(s=>s.type==='settings'));
}

async function saveUserName(){
  const name = document.getElementById('s_name').value.trim();
  setDeviceName(name);
  await customAlert('Nome salvato su questo dispositivo: ' + (name || '(vuoto)'));
}

async function exportData(){
  const data = {};
  for(const key of DATA_KEYS){
    data[key] = await sGet(key, []);
  }
  const customSections = data.custom_sections || [];
  data.custom_data = {};
  for(const s of customSections){
    data.custom_data[s.id] = await sGet('custom_data_' + s.id, []);
  }
  data._exported_at = new Date().toISOString();
  window._backupJson = JSON.stringify(data, null, 2);

  pageTitle.textContent = 'Backup pronto';
  main.innerHTML = `
    <div class="card">
      <div class="title">✅ Backup pronto (${APP_VERSION})</div>
      <div class="body">Tocca il pulsante per salvare il backup nella cartella Download.</div>
      <button class="btn block" style="margin-top:12px;" onclick="scaricaBackup()">📥 Scarica backup</button>
      <div id="backupConferma" class="hidden" style="margin-top:14px; padding:12px; background:#d7f5e3; border-radius:12px; text-align:center; font-size:14px;">
        ✅ Backup salvato! Controlla la cartella Download.
      </div>
    </div>
  `;
}
function scaricaBackup(){
  var json = window._backupJson;
  if(!json) return;
  var blob = new Blob([json], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'camper-app-backup-' + todayStr() + '.json';
  a.click();
  var el = document.getElementById('backupConferma');
  if(el) el.classList.remove('hidden');
}

async function importData(){
  const fileInput = document.getElementById('s_file');
  const file = fileInput.files[0];
  if(!file){ await customAlert('Seleziona prima un file di backup.'); return; }
  if(!(await customConfirm('Questo sovrascriverà tutti i dati attuali. Continuare?'))) return;

  try{
    const text = await file.text();
    const data = JSON.parse(text);
    for(const key of DATA_KEYS){
      if(key in data) await sSet(key, data[key]);
    }
    if(data.custom_data){
      for(const sectionId in data.custom_data){
        await sSet('custom_data_' + sectionId, data.custom_data[sectionId]);
      }
    }
    state.customSections = await sGet('custom_sections', []);
    await customAlert('Dati importati con successo.');
    navigate('home');
  }catch(e){
    await customAlert('File non valido o corrotto. Import annullato.');
  }
}

// ── Sequenza di avvio: effetto "puzzle" sulle card della home (solo al primo avvio) ──
function assemblaHome() {
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const listWrap = document.querySelector('#main .list');
  if(!listWrap) return;
  const items = Array.prototype.slice.call(listWrap.querySelectorAll(':scope > .item'));
  if(!items.length) return;

  const testRect = items[0].getBoundingClientRect();
  if((testRect.width === 0 || testRect.height === 0) && !assemblaHome._retried){
    assemblaHome._retried = true;
    setTimeout(assemblaHome, 150);
    return;
  }

  const GRID_COLS = 3, GRID_ROWS = 2;
  const holders = items.map((item, itemIndex) => {
    const rect = item.getBoundingClientRect();
    const w = rect.width, h = rect.height;
    const cellW = w / GRID_COLS, cellH = h / GRID_ROWS;

    const holder = document.createElement('div');
    holder.className = 'frag-holder';
    holder.style.height = h + 'px';

    for(let r=0; r<GRID_ROWS; r++){
      for(let c=0; c<GRID_COLS; c++){
        const frag = document.createElement('div');
        frag.className = 'frag';
        frag.style.width = cellW + 'px';
        frag.style.height = cellH + 'px';
        frag.style.left = (c * cellW) + 'px';
        frag.style.top = (r * cellH) + 'px';

        const clone = item.cloneNode(true);
        clone.style.left = (-c * cellW) + 'px';
        clone.style.top = (-r * cellH) + 'px';
        clone.style.width = w + 'px';
        clone.style.height = h + 'px';
        frag.appendChild(clone);

        const angle = Math.random() * Math.PI * 2;
        const dist = 30 + Math.random() * 50;
        const dx = Math.cos(angle) * dist;
        const dy = Math.sin(angle) * dist;
        const rot = (Math.random() - 0.5) * 30;
        const cellDelay = (r * GRID_COLS + c) * 10;

        frag.style.setProperty('--dx', dx + 'px');
        frag.style.setProperty('--dy', dy + 'px');
        frag.style.setProperty('--rot', rot + 'deg');
        frag.style.setProperty('--delay', (itemIndex * 70 + cellDelay) + 'ms');

        holder.appendChild(frag);
      }
    }
    return holder;
  });

  items.forEach((item, i) => listWrap.replaceChild(holders[i], item));

  const INITIAL_PAUSE = 350;
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      setTimeout(()=>{
        document.querySelectorAll('#main .frag').forEach(f => f.classList.add('play'));
        const maxDelay = (items.length - 1) * 70 + (GRID_ROWS*GRID_COLS - 1) * 10 + 360 + 60;
        setTimeout(()=>{
          holders.forEach((holder, i) => {
            if(holder.parentNode) listWrap.replaceChild(items[i], holder);
          });
        }, maxDelay);
      }, INITIAL_PAUSE);
    });
  });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str||'';
  return d.innerHTML;
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

</script>
