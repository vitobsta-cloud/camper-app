<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Il Mio Camper</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e8834a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#eef1f4; --card:#ffffff; --text:#1c1c1e; --muted:#8a8f98;
    --border:#e6e8eb; --accent:#e8834a; --ok:#34a366; --danger:#e5484d;
    --shadow: 0 1px 2px rgba(20,20,30,0.06), 0 1px 1px rgba(20,20,30,0.04);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
  }
  header{
    padding:16px; background:var(--bg);
    position:sticky; top:0; z-index:10;
    display:flex; align-items:center; gap:8px;
  }
  header .back{
    background:var(--card); border:1px solid var(--border); color:var(--text); font-size:18px; cursor:pointer;
    padding:6px 12px; display:none; border-radius:10px; box-shadow:var(--shadow);
  }
  header .back.show{display:inline-block;}
  header h1{font-size:20px; margin:0; font-weight:700; flex:1;}
  main{padding:0 16px 40px; max-width:640px; margin:0 auto;}

  .list{display:flex; flex-direction:column; gap:12px;}
  .item{
    background:var(--card); border-radius:18px; box-shadow:var(--shadow);
    padding:16px; display:flex; align-items:center; gap:14px; cursor:pointer;
    border:1px solid transparent;
  }
  .item:active{transform:scale(.98);}
  .item .badge{
    width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center;
    font-size:24px; flex-shrink:0;
  }
  .item .txt{flex:1; min-width:0;}
  .item .txt .t{font-size:16.5px; font-weight:700; margin-bottom:2px;}
  .item .txt .s{font-size:13.5px; color:var(--muted);}
  .item .chev{color:#c4c8cd; font-size:20px; flex-shrink:0;}
  .item.add{border:1.5px dashed #c9ccd1; box-shadow:none;}
  .item.add .badge{background:#eceef1; color:var(--muted);}

  .card{
    background:var(--card); border-radius:16px; box-shadow:var(--shadow);
    padding:16px; margin-bottom:12px;
  }
  .card .meta{color:var(--muted); font-size:12px; margin-bottom:4px;}
  .card .title{font-weight:700; font-size:15.5px; margin-bottom:4px;}
  .card .body{font-size:14px; line-height:1.45; white-space:pre-wrap; color:#3a3d42;}
  .card .row{display:flex; gap:8px; margin-top:12px;}

  button{font-family:inherit;}
  .btn{
    background:var(--accent); color:#fff; border:none; border-radius:12px;
    padding:11px 14px; font-size:14.5px; font-weight:700; cursor:pointer;
  }
  .btn.secondary{background:#f1f2f4; color:var(--text);}
  .btn.ok{background:var(--ok);}
  .btn.danger{background:transparent; color:var(--danger); border:1px solid #f3caca; padding:9px 12px; font-size:13.5px;}
  .btn.small{padding:8px 12px; font-size:13.5px;}
  .btn.block{width:100%; padding:14px; font-size:15.5px; margin-top:4px;}

  input[type=text], input[type=date], textarea, select{
    width:100%; background:#f6f7f8; border:1px solid var(--border); color:var(--text);
    border-radius:12px; padding:12px; font-size:15px; margin-bottom:10px; font-family:inherit;
  }
  textarea{min-height:80px; resize:vertical;}
  label{font-size:12.5px; color:var(--muted); display:block; margin-bottom:5px; font-weight:600;}

  .empty{color:var(--muted); text-align:center; padding:36px 10px; font-size:14px;}
  .checkitem{
    display:flex; align-items:center; gap:12px; padding:14px;
    background:var(--card); box-shadow:var(--shadow); border-radius:14px; margin-bottom:8px;
    cursor:pointer; transition:background .15s, transform .08s; user-select:none;
  }
  .checkitem:active{transform:scale(.98);}
  .checkitem.done{background:#eaf7ee;}
  .check-circle{
    width:27px; height:27px; border-radius:50%; border:2px solid #cfd3d8; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:800; color:#fff;
    transition:background .15s, border-color .15s;
  }
  .checkitem.done .check-circle{background:var(--ok); border-color:var(--ok);}
  .checkitem .label{flex:1; font-size:14.5px;}
  .checkitem.done .label{text-decoration:line-through; color:var(--muted);}
  .del{background:none; border:none; color:#c4c8cd; font-size:19px; cursor:pointer; padding:2px 6px; flex-shrink:0;}

  .fixed-action{position:fixed; left:0; right:0; bottom:0; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); background:linear-gradient(to top, var(--bg) 65%, transparent); z-index:50;}
  .fixed-action .inner{max-width:640px; margin:0 auto;}
  .list-spacer{height:76px;}

  .fab-row{display:flex; gap:8px; margin-bottom:14px; margin-top:14px;}
  .status{font-size:12px; color:var(--muted); text-align:center; margin-top:24px;}
  .hidden{display:none !important;}

  .cat-header{
    display:flex; align-items:center; gap:8px; margin:20px 0 10px; padding:8px 14px;
    border-radius:12px; font-weight:800; font-size:14px; letter-spacing:0.2px;
  }
  .cat-header:first-child{margin-top:4px;}
  .cat-count{font-weight:600; font-size:12px; opacity:0.75;}

  /* ── Sequenza di avvio: effetto "puzzle" sulle card della home ── */
  .frag-holder{position:relative;}
  .frag{position:absolute; opacity:0; overflow:hidden; will-change:transform,opacity;}
  .frag>.item{position:absolute; margin:0; pointer-events:none;}
  @keyframes fragIn{
    0%{opacity:0; transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.5);}
    60%{opacity:1;}
    100%{opacity:1; transform:translate(0,0) rotate(0) scale(1);}
  }
  .frag.play{animation:fragIn 360ms cubic-bezier(.2,.8,.2,1) forwards; animation-delay:var(--delay,0ms);}
  @media (prefers-reduced-motion: reduce){.frag{animation:none!important; opacity:1!important; transform:none!important;}}

  .credits{position:fixed; bottom:10px; right:14px; font-size:11px; color:var(--muted); font-family:monospace; z-index:5; background:rgba(255,255,255,0.85); padding:4px 10px; border-radius:20px; backdrop-filter:blur(4px);}

  .login-screen{position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:20px; z-index:100;}
  .login-card{background:var(--card); border-radius:20px; box-shadow:var(--shadow); padding:30px 24px; max-width:360px; width:100%;}
  .login-card h2{margin:0 0 6px; font-size:21px;}
  .login-card .sub{color:var(--muted); font-size:13.5px; margin:0 0 20px;}
  .login-error{color:var(--danger); font-size:13px; margin-bottom:10px; display:none; background:#fdeaea; padding:8px 10px; border-radius:8px;}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <h2>🚐 Il Mio Camper</h2>
    <div class="sub">Accedi per continuare</div>
    <div id="loginError" class="login-error"></div>
    <label>Email</label>
    <input type="text" id="login_email" placeholder="Email" autocomplete="username">
    <label>Password</label>
    <input type="password" id="login_password" placeholder="Password" autocomplete="current-password">
    <button class="btn block" onclick="doLogin()">Accedi</button>
  </div>
</div>

<div id="appRoot" class="hidden">
<header>
  <button class="back" id="backBtn">←</button>
  <h1 id="pageTitle">🚐 Il Mio Camper</h1>
</header>

<main id="main"></main>
<div class="credits">Il Mio Camper <span id="creditsVersione"></span></div>
</div>

<script>
// ---------- Firebase setup ----------
const firebaseConfig = {
  apiKey: "AIzaSyCOYBM320R9EwwMkBWpLTHlEiBZA8gg02Q",
  authDomain: "camper-app-ccb86.firebaseapp.com",
  projectId: "camper-app-ccb86",
  storageBucket: "camper-app-ccb86.firebasestorage.app",
  messagingSenderId: "476280929219",
  appId: "1:476280929219:web:eda2af5900348b9333db76"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const COLLECTION = 'camperApp';

// ---------- Autenticazione ----------
auth.onAuthStateChanged(user => {
  const loginScreen = document.getElementById('loginScreen');
  const appRoot = document.getElementById('appRoot');
  if(user){
    loginScreen.classList.add('hidden');
    appRoot.classList.remove('hidden');
    init();
  } else {
    loginScreen.classList.remove('hidden');
    appRoot.classList.add('hidden');
  }
});

async function doLogin(){
  const email = document.getElementById('login_email').value.trim();
  const password = document.getElementById('login_password').value;
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';
  if(!email || !password){
    errEl.textContent = 'Inserisci email e password.';
    errEl.style.display = 'block';
    return;
  }
  try{
    await auth.signInWithEmailAndPassword(email, password);
  }catch(e){
    errEl.textContent = 'Errore: ' + (e.code || e.message);
    errEl.style.display = 'block';
  }
}

// ---------- Storage helpers (Firestore-backed, shared tra i dispositivi) ----------
async function sGet(key, fallback){
  try{
    const snap = await db.collection(COLLECTION).doc(key).get();
    if(snap.exists){
      const data = snap.data();
      return data && data.value !== undefined ? data.value : fallback;
    }
    return fallback;
  }catch(e){ console.error('firestore get failed', key, e); return fallback; }
}
async function sSet(key, value){
  try{
    await db.collection(COLLECTION).doc(key).set({
      value,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  }catch(e){ console.error('firestore set failed', key, e); }
}

// ---------- Real-time listeners ----------
let activeListeners = {};
function watchKey(key){
  if(activeListeners[key]) return;
  activeListeners[key] = db.collection(COLLECTION).doc(key).onSnapshot(()=>{
    if(isTypingInForm()) return; // evita di cancellare un form che l'utente sta compilando
    render();
  }, err => console.error('listener error', key, err));
}
function unwatchAll(){
  Object.values(activeListeners).forEach(unsub => unsub());
  activeListeners = {};
}
function isTypingInForm(){
  const el = document.activeElement;
  if(!el) return false;
  const tag = el.tagName;
  return (tag==='INPUT' || tag==='TEXTAREA') && el.value && el.value.length>0;
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'numeric'});
}

const BASE_SECTIONS = [
  {id:'diario', icon:'📔', color:'#e8ddfb', label:'Diario di viaggio', sub:'Tappe, luoghi e ricordi', type:'diario'},
  {id:'manut_da_fare', icon:'🔧', color:'#fde3cf', label:'Manutenzione da effettuare', sub:'Interventi da programmare', type:'manut_todo'},
  {id:'manut_fatta', icon:'✅', color:'#d7f5e3', label:'Manutenzione effettuata', sub:'Storico interventi eseguiti', type:'manut_done'},
  {id:'checklist', icon:'📋', color:'#dbeafe', label:'Checklist partenza', sub:'Lista di controllo pre-viaggio', type:'checklist'},
  {id:'lista_spesa', icon:'🛒', color:'#fef3c7', label:'Lista della spesa', sub:'Organizzata per categoria', type:'lista_spesa'},
  {id:'impostazioni', icon:'⚙️', color:'#eceef1', label:'Impostazioni', sub:'Nome, salvataggio, importa/esporta', type:'settings'},
];
const CUSTOM_COLORS = ['#fde0e0','#fdf1c7','#d7f0f5','#e3e6fd','#e4f5d7','#fbe0ef'];

let state = { route: 'home', customSections: [] };
let homeAnimatedOnce = false;

const main = document.getElementById('main');
const pageTitle = document.getElementById('pageTitle');
const backBtn = document.getElementById('backBtn');
backBtn.addEventListener('click', ()=> navigate('home'));

async function init(){
  state.customSections = await sGet('custom_sections', []);
  navigate('home');
}

function navigate(route){
  unwatchAll();
  const oldBar = document.getElementById('lsFixedBar');
  if(oldBar) oldBar.remove();
  state.route = route;
  backBtn.classList.toggle('show', route!=='home');
  render();
}

async function render(){
  if(state.route === 'home') return renderHome();
  const base = BASE_SECTIONS.find(s=>s.id===state.route);
  if(base) return renderBySection(base);
  const custom = state.customSections.find(s=>s.id===state.route);
  if(custom) return renderCustom(custom);
  navigate('home');
}

function renderHome(){
  pageTitle.textContent = '🚐 Il Mio Camper';
  watchKey('custom_sections');
  let html = '<div class="list">';
  BASE_SECTIONS.forEach(s=>{
    html += itemHtml(s.id, s.icon, s.color, s.label, s.sub);
  });
  state.customSections.forEach((s,i)=>{
    html += itemHtml(s.id, s.icon||'📦', CUSTOM_COLORS[i%CUSTOM_COLORS.length], s.label, 'Sezione personalizzata');
  });
  html += `<button class="item add" onclick="promptNewSection()">
      <span class="badge">＋</span>
      <span class="txt"><div class="t">Aggiungi sezione</div><div class="s">Crea una nuova voce personalizzata</div></span>
    </button>`;
  html += '</div>';
  html += `<div class="status">Dati salvati automaticamente sul dispositivo</div>`;
  main.innerHTML = html;

  const cvEl = document.getElementById('creditsVersione');
  if(cvEl) cvEl.textContent = APP_VERSION;

  if(!homeAnimatedOnce){
    homeAnimatedOnce = true;
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        try{ assemblaHome(); }catch(e){ console.error('assembly error:', e); }
      });
    });
  }
}
function itemHtml(id, icon, color, label, sub){
  return `<button class="item" onclick="navigate('${id}')">
    <span class="badge" style="background:${color}">${icon}</span>
    <span class="txt"><div class="t">${escapeHtml(label)}</div><div class="s">${escapeHtml(sub||'')}</div></span>
    <span class="chev">›</span>
  </button>`;
}

async function promptNewSection(){
  const label = prompt('Nome della nuova sezione (es. "Rifornimento gas", "Contatti utili"):');
  if(!label || !label.trim()) return;
  const icon = prompt('Emoji/icona per la sezione (opzionale, es. 🔥, 📍, 🧰):', '📦') || '📦';
  const id = 'custom_' + uid();
  state.customSections.push({id, label:label.trim(), icon:icon.trim()||'📦'});
  await sSet('custom_sections', state.customSections);
  render();
}

async function renderBySection(section){
  if(section.type==='diario') return renderDiario(section);
  if(section.type==='manut_todo') return renderManutTodo(section);
  if(section.type==='manut_done') return renderManutDone(section);
  if(section.type==='checklist') return renderChecklist(section);
  if(section.type==='lista_spesa') return renderListaSpesa(section);
  if(section.type==='settings') return renderSettings(section);
}

async function renderDiario(section){
  pageTitle.textContent = section.label;
  watchKey('diario_entries');
  const entries = await sGet('diario_entries', []);
  let html = `
    <div class="card">
      <label>Data</label>
      <input type="date" id="d_date" value="${todayStr()}">
      <label>Titolo (es. tappa, luogo)</label>
      <input type="text" id="d_title" placeholder="Es. Arrivo a Cinque Terre">
      <label>Note</label>
      <textarea id="d_text" placeholder="Cosa è successo oggi..."></textarea>
      <button class="btn block" onclick="addDiario()">Salva voce</button>
    </div>`;
  if(entries.length===0){
    html += `<div class="empty">Nessuna voce ancora. Aggiungi il tuo primo giorno di viaggio!</div>`;
  } else {
    entries.slice().reverse().forEach(e=>{
      html += `<div class="card">
        <div class="meta">${fmtDate(e.date)}</div>
        <div class="title">${escapeHtml(e.title||'(senza titolo)')}</div>
        <div class="body">${escapeHtml(e.text||'')}</div>
        <div class="row"><button class="btn danger" onclick="delDiario('${e.id}')">Elimina</button></div>
      </div>`;
    });
  }
  main.innerHTML = html;
}
async function addDiario(){
  const date = document.getElementById('d_date').value || todayStr();
  const title = document.getElementById('d_title').value.trim();
  const text = document.getElementById('d_text').value.trim();
  if(!title && !text) return;
  const entries = await sGet('diario_entries', []);
  entries.push({id:uid(), date, title, text});
  await sSet('diario_entries', entries);
  renderDiario(BASE_SECTIONS[0]);
}
async function delDiario(id){
  let entries = await sGet('diario_entries', []);
  entries = entries.filter(e=>e.id!==id);
  await sSet('diario_entries', entries);
  renderDiario(BASE_SECTIONS[0]);
}

async function renderManutTodo(section){
  pageTitle.textContent = section.label;
  watchKey('manut_todo');
  const todo = await sGet('manut_todo', []);
  let html = `
    <div class="card">
      <label>Intervento da fare</label>
      <input type="text" id="m_task" placeholder="Es. Cambio olio, controllo gas...">
      <label>Note (opzionale)</label>
      <textarea id="m_note" placeholder="Dettagli, scadenza, km..."></textarea>
      <button class="btn block" onclick="addManutTodo()">Aggiungi</button>
    </div>`;
  if(todo.length===0){
    html += `<div class="empty">Nessuna manutenzione in sospeso 🎉</div>`;
  } else {
    todo.forEach(t=>{
      html += `<div class="card">
        <div class="title">${escapeHtml(t.task)}</div>
        ${t.note ? `<div class="body">${escapeHtml(t.note)}</div>` : ''}
        <div class="row">
          <button class="btn ok small" onclick="completeManut('${t.id}')">✅ Fatto</button>
          <button class="btn danger" onclick="delManutTodo('${t.id}')">Elimina</button>
        </div>
      </div>`;
    });
  }
  main.innerHTML = html;
}
async function addManutTodo(){
  const task = document.getElementById('m_task').value.trim();
  const note = document.getElementById('m_note').value.trim();
  if(!task) return;
  const todo = await sGet('manut_todo', []);
  todo.push({id:uid(), task, note});
  await sSet('manut_todo', todo);
  renderManutTodo(BASE_SECTIONS[1]);
}
async function delManutTodo(id){
  let todo = await sGet('manut_todo', []);
  todo = todo.filter(t=>t.id!==id);
  await sSet('manut_todo', todo);
  renderManutTodo(BASE_SECTIONS[1]);
}
async function completeManut(id){
  let todo = await sGet('manut_todo', []);
  const item = todo.find(t=>t.id===id);
  if(!item) return;
  todo = todo.filter(t=>t.id!==id);
  await sSet('manut_todo', todo);
  const done = await sGet('manut_done', []);
  done.push({id:uid(), task:item.task, note:item.note, date:todayStr()});
  await sSet('manut_done', done);
  renderManutTodo(BASE_SECTIONS[1]);
}

async function renderManutDone(section){
  pageTitle.textContent = section.label;
  watchKey('manut_done');
  const done = await sGet('manut_done', []);
  let html = '';
  if(done.length===0){
    html += `<div class="empty">Nessuna manutenzione registrata ancora.</div>`;
  } else {
    done.slice().reverse().forEach(t=>{
      html += `<div class="card">
        <div class="meta">${fmtDate(t.date)}</div>
        <div class="title">${escapeHtml(t.task)}</div>
        ${t.note ? `<div class="body">${escapeHtml(t.note)}</div>` : ''}
        <div class="row"><button class="btn danger" onclick="delManutDone('${t.id}')">Elimina</button></div>
      </div>`;
    });
  }
  main.innerHTML = html;
}
async function delManutDone(id){
  let done = await sGet('manut_done', []);
  done = done.filter(t=>t.id!==id);
  await sSet('manut_done', done);
  renderManutDone(BASE_SECTIONS[2]);
}

// Categorie di default create al primo utilizzo, se non ne esiste ancora nessuna
async function ensureDefaultChecklistCategories(){
  let cats = await sGet('checklist_categories', null);
  if(cats === null || cats.length === 0){
    cats = [
      {id:uid(), name:'Documenti essenziali', priority:'alta'},
      {id:uid(), name:'Generale', priority:'normale'}
    ];
    await sSet('checklist_categories', cats);
  }
  return cats;
}
function prioritaStile(priority){
  return priority === 'alta'
    ? {bg:'#fde0e0', icon:'🔴'}
    : {bg:'#dbeafe', icon:'🔵'};
}

async function renderChecklist(section){
  pageTitle.textContent = section.label;
  watchKey('checklist_items');
  watchKey('checklist_categories');
  const items = await sGet('checklist_items', []);
  const categorie = await ensureDefaultChecklistCategories();
  const catByName = {};
  categorie.forEach(c => catByName[c.name] = c);

  let html = `<div class="fab-row">
      <button class="btn secondary small" onclick="resetChecklist()">🔄 Nuovo viaggio (resetta spunte)</button>
    </div>
    <div class="card">
      <label>Nuova voce checklist</label>
      <input type="text" id="c_text" placeholder="Es. Controllare gas, riempire acqua...">
      <label>Categoria</label>
      <select id="c_cat">
        ${categorie.map(c=>`<option value="${escapeHtml(c.name)}">${prioritaStile(c.priority).icon} ${escapeHtml(c.name)}</option>`).join('')}
      </select>
      <div class="body" style="margin:-2px 0 10px; font-size:12.5px;">Le categorie si aggiungono da Impostazioni.</div>
      <button class="btn block" onclick="addChecklistItem()">Aggiungi voce</button>
    </div>`;

  if(items.length===0){
    html += `<div class="empty">Nessuna voce. Crea la tua checklist di partenza.</div>`;
  } else {
    const gruppi = {};
    items.forEach(it=>{
      const cat = it.category || 'Generale';
      if(!gruppi[cat]) gruppi[cat] = [];
      gruppi[cat].push(it);
    });
    const ordinePriorita = { alta:0, normale:1 };
    const nomiCategorie = Object.keys(gruppi).sort((a,b)=>{
      const pa = (catByName[a]?.priority) || 'normale';
      const pb = (catByName[b]?.priority) || 'normale';
      if(ordinePriorita[pa] !== ordinePriorita[pb]) return ordinePriorita[pa]-ordinePriorita[pb];
      return a.localeCompare(b);
    });
    nomiCategorie.forEach(cat=>{
      const list = gruppi[cat];
      const priority = (catByName[cat]?.priority) || 'normale';
      const stile = prioritaStile(priority);
      const fatti = list.filter(i=>i.done).length;
      html += `<div class="cat-header" style="background:${stile.bg}">
        <span>${stile.icon} ${escapeHtml(cat)}</span>
        <span class="cat-count">${fatti}/${list.length}</span>
      </div>`;
      list.forEach(it=>{
        html += `<div class="checkitem ${it.done?'done':''}" onclick="toggleChecklistItem('${it.id}')">
          <span class="check-circle">${it.done?'✓':''}</span>
          <span class="label">${escapeHtml(it.text)}</span>
          <button class="del" onclick="event.stopPropagation(); delChecklistItem('${it.id}')">🗑️</button>
        </div>`;
      });
    });
  }
  main.innerHTML = html;
}

// ---------- LISTA DELLA SPESA ----------
const CATEGORIE_SUGGERITE = ['Alimentari','Frutta e verdura','Igiene','Pulizia','Bevande','Ricambi camper','Altro'];
const CAT_COLORS = {
  'Alimentari':'#fde3cf', 'Frutta e verdura':'#d7f5e3', 'Igiene':'#dbeafe', 'Pulizia':'#e8ddfb',
  'Bevande':'#fde0e0', 'Ricambi camper':'#fdf1c7', 'Altro':'#eceef1'
};
function colorePerCategoria(cat){
  if(CAT_COLORS[cat]) return CAT_COLORS[cat];
  let hash = 0;
  for(let i=0;i<cat.length;i++) hash = cat.charCodeAt(i) + ((hash<<5)-hash);
  return CUSTOM_COLORS[Math.abs(hash) % CUSTOM_COLORS.length];
}

async function renderListaSpesa(section){
  pageTitle.textContent = section.label;
  watchKey('lista_spesa_items');
  const items = await sGet('lista_spesa_items', []);
  const categorieEsistenti = [...new Set(items.map(i=>i.category))];
  const opzioni = [...new Set([...CATEGORIE_SUGGERITE, ...categorieEsistenti])];

  let html = `
    <div class="card">
      <label>Articolo</label>
      <input type="text" id="ls_text" placeholder="Es. Pane, detersivo piatti...">
      <label>Categoria</label>
      <select id="ls_cat_select" onchange="onCategoriaLSChange()">
        ${opzioni.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}
        <option value="__nuova__">➕ Nuova categoria...</option>
      </select>
      <input type="text" id="ls_cat_custom" placeholder="Nome della nuova categoria" class="hidden" style="margin-top:-2px;">
      <button class="btn block" onclick="addListaSpesa()">Aggiungi</button>
    </div>`;

  if(items.length===0){
    html += `<div class="empty">Lista vuota. Aggiungi il primo articolo!</div>`;
  } else {
    const gruppi = {};
    items.forEach(it=>{
      const cat = it.category || 'Altro';
      if(!gruppi[cat]) gruppi[cat] = [];
      gruppi[cat].push(it);
    });
    Object.keys(gruppi).sort().forEach(cat=>{
      const list = gruppi[cat];
      const presi = list.filter(i=>i.done).length;
      html += `<div class="cat-header" style="background:${colorePerCategoria(cat)}">
        <span>${escapeHtml(cat)}</span>
        <span class="cat-count">${presi}/${list.length}</span>
      </div>`;
      list.forEach(it=>{
        html += `<div class="checkitem ${it.done?'done':''}" onclick="toggleListaSpesa('${it.id}')">
          <span class="check-circle">${it.done?'✓':''}</span>
          <span class="label">${escapeHtml(it.text)}</span>
          <button class="del" onclick="event.stopPropagation(); delListaSpesa('${it.id}')">✕</button>
        </div>`;
      });
    });
    html += `<div class="list-spacer"></div>`;
  }
  main.innerHTML = html;

  const oldBar = document.getElementById('lsFixedBar');
  if(oldBar) oldBar.remove();
  if(items.length>0){
    const bar = document.createElement('div');
    bar.id = 'lsFixedBar';
    bar.className = 'fixed-action';
    bar.innerHTML = `<div class="inner"><button class="btn block" onclick="chiudiSpesa()">✅ Chiudi spesa</button></div>`;
    document.body.appendChild(bar);
  }
}

async function saveUserName(){
  const name = document.getElementById('s_name').value.trim();
  await sSet('user_name', name);
  alert('Nome salvato: ' + (name || '(vuoto)'));
}

async function exportData(){
  const data = {};
  for(const key of DATA_KEYS){
    data[key] = await sGet(key, key==='user_name' ? '' : []);
  }
  const customSections = data.custom_sections || [];
  data.custom_data = {};
  for(const s of customSections){
    data.custom_data[s.id] = await sGet('custom_data_' + s.id, []);
  }
  data._exported_at = new Date().toISOString();

  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'camper-app-backup-' + todayStr() + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function importData(){
  const fileInput = document.getElementById('s_file');
  const file = fileInput.files[0];
  if(!file){ alert('Seleziona prima un file di backup.'); return; }
  if(!confirm('Questo sovrascriverà tutti i dati attuali. Continuare?')) return;

  try{
    const text = await file.text();
    const data = JSON.parse(text);
    for(const key of DATA_KEYS){
      if(key in data) await sSet(key, data[key]);
    }
    if(data.custom_data){
      for(const sectionId in data.custom_data){
        await sSet('custom_data_' + sectionId, data.custom_data[sectionId]);
      }
    }
    state.customSections = await sGet('custom_sections', []);
    alert('Dati importati con successo.');
    navigate('home');
  }catch(e){
    alert('File non valido o corrotto. Import annullato.');
  }
}

// ── Sequenza di avvio: effetto "puzzle" sulle card della home (solo al primo avvio) ──
function assemblaHome() {
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const listWrap = document.querySelector('#main .list');
  if(!listWrap) return;
  const items = Array.prototype.slice.call(listWrap.querySelectorAll(':scope > .item'));
  if(!items.length) return;

  const testRect = items[0].getBoundingClientRect();
  if((testRect.width === 0 || testRect.height === 0) && !assemblaHome._retried){
    assemblaHome._retried = true;
    setTimeout(assemblaHome, 150);
    return;
  }

  const GRID_COLS = 3, GRID_ROWS = 2;
  const holders = items.map((item, itemIndex) => {
    const rect = item.getBoundingClientRect();
    const w = rect.width, h = rect.height;
    const cellW = w / GRID_COLS, cellH = h / GRID_ROWS;

    const holder = document.createElement('div');
    holder.className = 'frag-holder';
    holder.style.height = h + 'px';

    for(let r=0; r<GRID_ROWS; r++){
      for(let c=0; c<GRID_COLS; c++){
        const frag = document.createElement('div');
        frag.className = 'frag';
        frag.style.width = cellW + 'px';
        frag.style.height = cellH + 'px';
        frag.style.left = (c * cellW) + 'px';
        frag.style.top = (r * cellH) + 'px';

        const clone = item.cloneNode(true);
        clone.style.left = (-c * cellW) + 'px';
        clone.style.top = (-r * cellH) + 'px';
        clone.style.width = w + 'px';
        clone.style.height = h + 'px';
        frag.appendChild(clone);

        const angle = Math.random() * Math.PI * 2;
        const dist = 30 + Math.random() * 50;
        const dx = Math.cos(angle) * dist;
        const dy = Math.sin(angle) * dist;
        const rot = (Math.random() - 0.5) * 30;
        const cellDelay = (r * GRID_COLS + c) * 10;

        frag.style.setProperty('--dx', dx + 'px');
        frag.style.setProperty('--dy', dy + 'px');
        frag.style.setProperty('--rot', rot + 'deg');
        frag.style.setProperty('--delay', (itemIndex * 70 + cellDelay) + 'ms');

        holder.appendChild(frag);
      }
    }
    return holder;
  });

  items.forEach((item, i) => listWrap.replaceChild(holders[i], item));

  const INITIAL_PAUSE = 350;
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      setTimeout(()=>{
        document.querySelectorAll('#main .frag').forEach(f => f.classList.add('play'));
        const maxDelay = (items.length - 1) * 70 + (GRID_ROWS*GRID_COLS - 1) * 10 + 360 + 60;
        setTimeout(()=>{
          holders.forEach((holder, i) => {
            if(holder.parentNode) listWrap.replaceChild(items[i], holder);
          });
        }, maxDelay);
      }, INITIAL_PAUSE);
    });
  });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str||'';
  return d.innerHTML;
}
